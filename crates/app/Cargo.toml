[package]
name = "shoji"
version = "0.1.0"
edition = "2021"
authors = ["Shoji Contributors"]
description = "A paper-thin, privacy-first desktop browser for Windows"
license = "MIT"

[dependencies]
shoji-core = { path = "../core" }
shoji-brand = { path = "../brand" }
shoji-byobu = { path = "../byobu" }
base64 = "0.22"
winit = "0.30"
wry = { version = "0.57", features = ["devtools"] }
serde_json = "1.0"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = { version = "0.62.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[build-dependencies]
winres = "0.1"
shoji-brand = { path = "../brand" }
