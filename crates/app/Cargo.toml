[package]
name = "shoji"
version = "0.1.5"
edition = "2021"
authors = ["Shoji Contributors"]
description = "A paper-thin, privacy-first desktop browser for Windows"
license = "MIT"
publish = false

[dependencies]
shoji-core = { path = "../core" }
shoji-brand = { path = "../brand" }
shoji-byobu = { path = "../byobu" }
base64 = "0.22"
winit = "0.30"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = { version = "0.62.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
winres = "0.1"
shoji-brand = { path = "../brand" }
