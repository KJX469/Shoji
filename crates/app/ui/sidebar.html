<!DOCTYPE html>
<html lang="en" data-accent="{{ACCENT}}" data-mode="{{MODE}}" data-fonts="{{FONTS}}">
<head>
  <meta charset="UTF-8">
  <title>Shoji panel</title>
  <style>
{{THEME_CSS}}
    html, body { height: 100%; overflow: hidden; }
    body { font-size: 13px; user-select: none; background: var(--surface); }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus:not(:focus-visible) { outline: none; }
    input, select { font: inherit; color: inherit; }

    /* The dropdown. The host rounds its window corners and floats it under the toolbar button
       it hangs from; pinned, it becomes a flat side panel. */
    .pop { height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; transform-origin: 50% 0; }
    body.docked .pop { border-radius: 0; border-width: 0 0 0 1px; }
    .pop.in { animation: pop-in .2s cubic-bezier(.2, .8, .2, 1) both; }
    .pop.out { animation: pop-out .13s ease-in both; }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-10px) scale(.96); } }
    @keyframes pop-out { to { opacity: 0; transform: translateY(-8px) scale(.97); } }
    @media (prefers-reduced-motion: reduce) { .pop.in, .pop.out { animation-duration: .01s; } }

    header { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 14px; flex-shrink: 0; }
    header .crane { width: 22px; height: 22px; flex-shrink: 0; }
    header h1 { flex: 1; font-family: var(--font-display); font-size: 15px; font-weight: 500; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--ink-3); }
    .icon-btn:hover { background: var(--hover); color: var(--ink); }
    .icon-btn.on { color: var(--accent); background: var(--tint-soft); }
    body.docked .pin-btn svg { transform: rotate(45deg); }

    main { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 8px 12px; scrollbar-width: thin; }
    .view { display: none; flex-direction: column; gap: 10px; }
    .view.active { display: flex; }
    .group { display: flex; flex-direction: column; }
    .item { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--ink); text-align: left; width: 100%; }
    .item:hover { background: var(--hover); }
    .item:active { background: var(--press); }
    .item svg.i { color: var(--ink-2); }
    .item span:first-of-type { flex: 1; }
    kbd { font: 11px var(--font); color: var(--ink-3); }
    .rule { height: 1px; background: var(--line); margin: 5px 8px; }
    .zoom { display: flex; align-items: center; gap: 4px; }
    .zoom button { width: 26px; height: 24px; border-radius: 6px; background: var(--surface-2); }
    .zoom button:hover { background: var(--press); }
    #zoomVal { min-width: 44px; text-align: center; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; cursor: pointer; }

    .note { font-family: var(--font-text); padding: 12px 14px; border-radius: 10px; background: var(--tint-soft); border: 1px solid var(--line); color: var(--ink-2); font-size: 12px; line-height: 1.55; }
    .note strong { color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 13px; }
    .note.warn strong { color: var(--warn); }
    .card { padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; font-size: 12px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row span:first-child { color: var(--ink-3); flex-shrink: 0; }
    .row span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
    .mono { font-family: var(--mono); font-size: 11px; }
    .wide-btn { width: 100%; height: 34px; border-radius: 8px; background: var(--surface-2); font-size: 12px; }
    .wide-btn:hover { background: var(--press); }
    .big { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .sub { color: var(--ink-3); font-size: 12px; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 2px; font-size: 13px; }
    .sw { width: 34px; height: 20px; border-radius: 10px; background: var(--line-strong); position: relative; flex-shrink: 0; transition: background .15s; }
    .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .18s cubic-bezier(.3, 1.4, .5, 1); }
    .sw[aria-checked="true"] { background: var(--accent); }
    .sw[aria-checked="true"]::after { transform: translateX(14px); }
    .sw:disabled { opacity: .5; cursor: default; }
    .empty { padding: 26px 0 30px; text-align: center; color: var(--ink-3); font-size: 12.5px; line-height: 1.6; }
    .scene { position: relative; display: grid; place-items: center; height: 84px; }
    .scene .crane { width: 54px; height: 54px; }
    .scene .zzz { left: calc(50% + 22px); top: 8px; font-size: 15px; }
    .scene .zzz:nth-of-type(2) { left: calc(50% + 32px); top: 0; }

    /* Shield */
    .guard-card { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(135deg, var(--tint-soft), transparent 70%); }
    .guard-card .crane { width: 46px; height: 46px; }
    .guard-card .sub { margin-top: 2px; }

    /* Downloads */
    .dl { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 10px; }
    .dl:hover { background: var(--hover); }
    .dl.can-open { cursor: pointer; }
    .dl-tile { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; background: var(--tint); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
    .dl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .dl-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl-meta { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dl-meta.bad { color: var(--warn); }
    .bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 2px; }
    .bar div { height: 100%; background: var(--accent); transition: width .2s linear; }
    .dl-acts { display: none; gap: 2px; flex-shrink: 0; }
    .dl:hover .dl-acts, .dl:focus-within .dl-acts { display: flex; }
    .dl-acts .icon-btn { width: 26px; height: 26px; }

    /* Dark websites */
    .seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); }
    .seg button { flex: 1; height: 28px; border-radius: 7px; font-size: 12px; color: var(--ink-2); transition: background .15s, color .15s; }
    .seg button:hover { color: var(--ink); }
    .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--line-strong); }
    .seg button:disabled { opacity: .4; cursor: default; }
    .sect { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; border-radius: 12px; border: 1px solid var(--line); }
    .sect > .label { display: flex; justify-content: space-between; align-items: baseline; }
    .sect > .label small { font: 11px var(--font); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
    .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .preset { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 5px; border-radius: 10px; font-size: 10.5px; color: var(--ink-2); border: 1px solid transparent; }
    .preset:hover { background: var(--hover); }
    .preset[aria-checked="true"] { border-color: var(--accent); color: var(--ink); background: var(--tint-soft); }
    .preset i { width: 36px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 600 12px var(--font-display); font-style: normal; border: 1px solid var(--line-strong); }
    .slide { display: grid; grid-template-columns: 74px 1fr 36px; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
    .slide output { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line-strong); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); transition: transform .12s; }
    input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.2); }
    .colors { display: flex; gap: 10px; }
    .colors label { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
    input[type="color"] { width: 30px; height: 24px; border: 1px solid var(--line-strong); border-radius: 6px; background: none; padding: 0; cursor: pointer; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 4px; }
    select, input[type="time"] { height: 28px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); outline: none; }
    select:focus, input[type="time"]:focus { border-color: var(--accent); }
    .times { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
    .times[hidden] { display: none; }
    .link { color: var(--accent); font-size: 12px; text-align: left; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="pop" id="pop">
    <header id="hdr">
      {{CRANE}}
      <h1 id="title">Shoji</h1>
      <button class="icon-btn pin-btn" id="pin" onclick="togglePin()" title="Pin as a side panel" aria-label="Pin as a side panel">
        <svg class="i" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/></svg>
      </button>
      <button class="icon-btn" onclick="post('CloseSidebar')" title="Close (Esc)" aria-label="Close">
        <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <main>
      <section class="view active" id="view-menu">
        <div class="group">
          <button class="item" onclick="act('CreateTab', { url: null })"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New tab</span><kbd>Ctrl+T</kbd></button>
          <button class="item" onclick="act('OpenNewWindow')"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 9h16"/></svg><span>New window</span><kbd>Ctrl+N</kbd></button>
          <div class="rule"></div>
          <button class="item" onclick="act('OpenPage', { page: 'history' })"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>History</span><kbd>Ctrl+H</kbd></button>
          <button class="item" onclick="post('ToggleDownloadsSidebar')"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Downloads</span><kbd>Ctrl+J</kbd></button>
          <button class="item" onclick="act('OpenPage', { page: 'passwords' })"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H20M17 12v3M14.5 12v2"/></svg><span>Passwords</span></button>
          <div class="rule"></div>
          <div class="item" style="cursor:default"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8.5 11h5"/></svg><span>Zoom</span>
            <div class="zoom"><button onclick="post('ZoomOut')" aria-label="Zoom out">−</button><span id="zoomVal" onclick="post('ZoomReset')" title="Reset">100%</span><button onclick="post('ZoomIn')" aria-label="Zoom in">+</button></div>
          </div>
          <button class="item" onclick="act('ToggleFindBar')"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span>Find in page</span><kbd>Ctrl+F</kbd></button>
          <button class="item" onclick="act('PrintPage')"><svg class="i" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></svg><span>Print</span><kbd>Ctrl+P</kbd></button>
          <div class="rule"></div>
          <button class="item" onclick="act('OpenClearData')"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg><span>Clear browsing data…</span><kbd>Ctrl+Shift+Del</kbd></button>
          <button class="item" onclick="act('OpenDevTools')"><svg class="i" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg><span>Developer tools</span><kbd>F12</kbd></button>
          <button class="item" onclick="act('OpenSettings')"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
        </div>
      </section>

      <section class="view" id="view-security">
        <div class="note" id="secNote"><strong id="secTitle"></strong><span id="secDesc"></span></div>
        <div class="card" id="certCard">
          <div class="row"><span>Site</span><span id="pHost"></span></div>
          <div class="row"><span>Issued to</span><span id="pSubject"></span></div>
          <div class="row"><span>Issued by</span><span id="pIssuer"></span></div>
          <div class="row"><span>Valid</span><span id="pValid"></span></div>
          <div class="row"><span>Signature</span><span id="pAlg"></span></div>
          <div class="row"><span>Thumbprint</span><span class="mono" id="pThumb"></span></div>
        </div>
        <button class="wide-btn" id="certBtn" onclick="post('OpenCertificateDialog', { host: currentHost })">View certificate</button>
        <div class="card">
          <div class="row"><span>Cookies &amp; storage</span><span id="pStorage"></span></div>
        </div>
      </section>

      <section class="view" id="view-shield">
        <div class="guard-card">
          {{CRANE_GUARD}}
          <div>
            <div class="sub" id="shHost"></div>
            <div class="big" id="shCount">0</div>
            <div class="sub">blocked on this page · <span id="shWeek">0</span> this week</div>
          </div>
        </div>
        <div class="card">
          <div class="switch-row"><span>Shield on this site</span><button class="sw" id="shSwitch" role="switch" aria-checked="true" aria-label="Shield on this site"></button></div>
          <div class="row"><span>Ads and trackers</span><span id="shBlocked">0</span></div>
          <div class="row"><span>Scripts replaced or cleaned</span><span id="shReplaced">0</span></div>
        </div>
        <div class="group">
          <button class="item" onclick="act('ShieldPickElement')"><svg class="i" viewBox="0 0 24 24"><path d="M5 5l6 14 2-6 6-2z"/></svg><span>Hide an element…</span></button>
          <button class="item" onclick="act('OpenPage', { page: 'byobu' })"><svg class="i" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>See what was blocked</span></button>
          <button class="item" onclick="act('OpenSettings')"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Filter lists and settings</span></button>
        </div>
        <div class="note" id="shNote" hidden></div>
      </section>

      <section class="view" id="view-downloads">
        <div class="scene" id="dlScene">{{CRANE_PET}}<span class="zzz">z</span><span class="zzz">z</span></div>
        <div id="dlList"></div>
        <div class="group" id="dlFoot">
          <div class="rule"></div>
          <button class="item" onclick="act('OpenPage', { page: 'downloads' })"><svg class="i" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Show all downloads</span></button>
          <button class="item" onclick="post('ChangeDownloadFolder')"><svg class="i" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg><span>Change download folder…</span></button>
        </div>
      </section>

      <section class="view" id="view-dark">
        <div class="sect">
          <div class="switch-row" style="padding:0"><span><b>Dark websites</b></span><button class="sw" id="dkOn" role="switch" aria-checked="false" aria-label="Dark websites"></button></div>
          <div id="dkSite">
            <div class="label" style="margin:2px 0 6px"><span id="dkHost"></span></div>
            <div class="seg" role="radiogroup" aria-label="This site">
              <button role="radio" id="dkSiteDark" aria-checked="false">Dark</button>
              <button role="radio" id="dkSiteLight" aria-checked="false">Left as is</button>
              <button role="radio" id="dkSiteCustom" aria-checked="false">Its own look</button>
            </div>
          </div>
        </div>

        <div class="sect" id="dkLook">
          <div class="label"><span>Look</span><small id="dkScope"></small></div>
          <div class="presets" id="dkPresets"></div>
          <div class="seg" role="radiogroup" aria-label="Mode">
            <button role="radio" id="dkModeDark" aria-checked="true">Dark</button>
            <button role="radio" id="dkModeLight" aria-checked="false">Dim, stay light</button>
          </div>
          <label class="slide">Brightness<input type="range" id="dkBrightness" min="50" max="150"><output></output></label>
          <label class="slide">Contrast<input type="range" id="dkContrast" min="50" max="150"><output></output></label>
          <label class="slide">Sepia<input type="range" id="dkSepia" min="0" max="100"><output></output></label>
          <label class="slide">Grayscale<input type="range" id="dkGrayscale" min="0" max="100"><output></output></label>
          <div class="colors">
            <label>Background<input type="color" id="dkBackground"></label>
            <label>Text<input type="color" id="dkText"></label>
          </div>
        </div>

        <div class="sect">
          <div class="label"><span>Text</span></div>
          <div class="switch-row" style="padding:0"><span>Use a font</span><select id="dkFont" aria-label="Font">
            <option>Segoe UI</option><option>Arial</option><option>Verdana</option><option>Tahoma</option><option>Trebuchet MS</option>
            <option>Georgia</option><option>Cambria</option><option>Consolas</option><option>Cascadia Mono</option>
          </select></div>
          <label class="slide">Text stroke<input type="range" id="dkStroke" min="0" max="100"><output></output></label>
        </div>

        <div class="sect">
          <div class="switch-row" style="padding:0"><span>Only at certain hours</span><button class="sw" id="dkSchedOn" role="switch" aria-checked="false" aria-label="Schedule"></button></div>
          <div class="times" id="dkTimes" hidden>From <input type="time" id="dkFrom"> to <input type="time" id="dkTo"></div>
        </div>

        <button class="link" id="dkReset" style="padding:0 2px 2px">Back to the Sumi look</button>
      </section>
    </main>
  </div>

  <script>
{{PET_JS}}
    const $ = id => document.getElementById(id);
    let currentHost = '';
    let mode = 'menu';
    let docked = false;
    const TITLES = { menu: 'Shoji', security: 'This site', shield: 'Byōbu', downloads: 'Downloads', dark: 'Dark websites' };
    function post(action, payload = null) {
      if (window.ipc) window.ipc.postMessage(JSON.stringify({ action, payload }));
    }
    // Run an action and fold the dropdown away (a pinned panel stays open).
    function act(action, payload = null) {
      post(action, payload);
      if (!docked) post('CloseSidebar');
    }
    function show(next) {
      mode = next;
      for (const m of ['menu', 'security', 'shield', 'downloads', 'dark']) {
        $('view-' + m).classList.toggle('active', m === mode);
      }
      $('title').textContent = TITLES[mode] || 'Shoji';
      reportHeight();
    }
    function togglePin() { post('PinSidebar', { pinned: !docked }); }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* Opening, closing and sizing: the host owns the window, this page owns the motion. */
    let lastHeight = 0;
    function reportHeight() {
      const v = document.querySelector('.view.active');
      if (!v) return;
      const h = $('hdr').offsetHeight + v.offsetHeight + 16;
      if (Math.abs(h - lastHeight) > 0.5) { lastHeight = h; post('SidebarHeight', { height: h }); }
    }
    new ResizeObserver(reportHeight).observe($('view-menu').parentElement);
    document.querySelectorAll('.view').forEach(v => new ResizeObserver(reportHeight).observe(v));
    window.__popOpen = d => {
      docked = !!d.docked;
      document.body.classList.toggle('docked', docked);
      $('pin').classList.toggle('on', docked);
      const pop = $('pop');
      pop.classList.remove('out', 'in');
      void pop.offsetWidth;
      if (!docked) pop.classList.add('in');
      show(d.mode);
      window.focus();
      if (mode === 'downloads') renderDownloads();
    };
    window.__popClose = () => {
      const pop = $('pop');
      pop.classList.remove('in');
      pop.classList.add('out');
    };
    window.__popMode = d => {
      docked = !!d.docked;
      document.body.classList.toggle('docked', docked);
      $('pin').classList.toggle('on', docked);
      $('pin').title = docked ? 'Unpin and float again' : 'Pin as a side panel';
    };
    addEventListener('keydown', e => { if (e.key === 'Escape') post('CloseSidebar'); });
    // Clicking anywhere else closes a floating dropdown.
    addEventListener('blur', () => { if (!docked) post('SidebarBlur'); });
    window.__applyTheme = t => { const r = document.documentElement; r.dataset.accent = t.accent; if (t.mode) r.dataset.mode = t.mode; if (t.fonts) r.dataset.fonts = t.fonts; };

    /* Shield */
    let shieldHost = '', shieldPaused = [], shieldState = 'on';
    window.__shieldPanel = (d, paused) => {
      shieldHost = d.host; shieldPaused = paused || []; shieldState = d.state;
      $('shHost').textContent = d.host || 'This page';
      $('shCount').textContent = d.blocked + d.replaced;
      $('shBlocked').textContent = d.blocked;
      $('shReplaced').textContent = d.replaced;
      $('shWeek').textContent = Number(d.week).toLocaleString();
      $('shSwitch').setAttribute('aria-checked', String(d.state === 'on'));
      $('shSwitch').disabled = d.state === 'off' || d.state === 'none';
      const note = $('shNote');
      note.hidden = d.state !== 'off' && d.ready;
      note.textContent = d.state === 'off' ? 'Byōbu is turned off in Settings.' : 'Loading filter lists…';
      // The crane stands guard while the screen is up, and rests when it is paused.
      const pet = document.querySelector('.guard-card .crane');
      if (pet) pet.dataset.pose = d.state === 'on' ? 'guard' : 'sleep';
    };
    $('shSwitch').onclick = () => {
      if (!shieldHost) return;
      const bare = shieldHost.replace(/^www\./, '');
      const list = shieldPaused.filter(p => p !== bare && p !== shieldHost);
      if (shieldState === 'on') list.push(bare);
      post('SaveSettings', { patch: { shield: { paused_sites: list } } });
    };
    window.__syncZoom = f => { $('zoomVal').textContent = Math.round(f * 100) + '%'; };

    window.__sidebarSync = function (msg) {
      const data = msg && (msg.data || msg);
      if (!data) return;
      // The host knows which dropdown is open; settle on it even if the first open ran early.
      if (data.mode && data.mode !== mode) show(data.mode);
      const s = data.security_info;
      if (!s) return;
      currentHost = s.host;
      const note = $('secNote');
      note.className = 'note' + (!s.is_secure && !s.is_internal ? ' warn' : '');
      if (s.is_internal) {
        $('secTitle').textContent = 'Shoji page';
        $('secDesc').textContent = 'This page is part of the browser and never touches the network.';
      } else if (s.is_secure) {
        $('secTitle').textContent = 'Connection is secure';
        $('secDesc').textContent = 'Information you send to this site is encrypted in transit.';
      } else {
        $('secTitle').textContent = 'Connection is not secure';
        $('secDesc').textContent = 'Avoid entering passwords or payment details — this connection can be read or altered.';
      }
      const showCert = s.is_secure && !s.is_internal;
      $('certCard').hidden = !showCert;
      $('certBtn').hidden = !showCert;
      const pending = s.has_certificate ? '' : '…';
      $('pHost').textContent = s.host;
      $('pSubject').textContent = s.subject || pending;
      $('pIssuer').textContent = s.issuer || pending;
      $('pValid').textContent = s.valid_from ? `${s.valid_from} → ${s.valid_to}` : pending;
      $('pAlg').textContent = s.signature_algorithm || pending;
      $('pThumb').textContent = s.thumbprint || pending;
      $('pStorage').textContent = s.is_internal ? '—' : (s.is_persistent ? 'Kept across sessions' : 'Cleared on exit');
    };

    /* Downloads: the saved list from the host, with live progress laid over what is running */
    let dlLog = [];
    const dlLive = new Map();
    window.__downloadsList = list => { dlLog = list || []; renderDownloads(); };
    window.__syncDownloads = d => { dlLive.set(d.key, d); renderDownloads(); };
    const size = b => {
      if (!(b > 0)) return '';
      const u = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      while (b >= 1024 && i < 3) { b /= 1024; i++; }
      return (i > 1 ? b.toFixed(1) : Math.round(b)) + ' ' + u[i];
    };
    const ago = ms => {
      const s = Math.max(0, (Date.now() - ms) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + ' min ago';
      if (s < 86400) return Math.floor(s / 3600) + ' h ago';
      return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    };
    function renderDownloads() {
      const rows = dlLog.slice(0, 12).map(e => {
        const live = dlLive.get(e.key);
        const running = live ? live.state === 'InProgress' : e.state === 'downloading';
        const done = live ? live.state === 'Completed' : e.state === 'done';
        const ext = (e.name.split('.').pop() || '').slice(0, 4);
        const pct = live && live.total_bytes > 0 ? Math.min(100, Math.round(live.received_bytes / live.total_bytes * 100)) : 0;
        const meta = running
          ? `${pct}% · ${size(live ? live.received_bytes : 0)}${live && live.total_bytes > 0 ? ' of ' + size(live.total_bytes) : ''}`
          : done ? [size(e.bytes), e.source, ago(e.started)].filter(Boolean).join(' · ')
          : 'Stopped · ' + ago(e.started);
        const acts = running
          ? `<button class="icon-btn" title="Cancel" aria-label="Cancel download" data-a="cancel"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`
          : `${done ? '<button class="icon-btn" title="Show in folder" aria-label="Show in folder" data-a="show"><svg class="i" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></button>' : ''}`
            + `<button class="icon-btn" title="Remove from list" aria-label="Remove from list" data-a="remove"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>`;
        return `<div class="dl${done ? ' can-open' : ''}" data-key="${e.key}" data-live="${live ? live.download_id : ''}" title="${esc(e.path)}">` +
          `<div class="dl-tile">${esc(ext || 'file')}</div>` +
          `<div class="dl-body"><div class="dl-name">${esc(e.name)}</div><div class="dl-meta${!running && !done ? ' bad' : ''}">${esc(meta)}</div>` +
          (running ? `<div class="bar"><div style="width:${pct}%"></div></div>` : '') + `</div>` +
          `<div class="dl-acts">${acts}</div></div>`;
      });
      $('dlList').innerHTML = rows.join('');
      $('dlFoot').hidden = !dlLog.length;
      const active = dlLog.some(e => { const l = dlLive.get(e.key); return l ? l.state === 'InProgress' : e.state === 'downloading'; });
      const pet = document.querySelector('#dlScene .crane');
      const want = active ? 'carry' : dlLog.length ? '' : 'sleep';
      if (pet && pet.dataset.pose !== want) { want ? pet.setAttribute('data-pose', want) : pet.removeAttribute('data-pose'); }
      $('dlScene').style.display = dlLog.length && !active ? 'none' : '';
      document.querySelectorAll('#dlScene .zzz').forEach(z => z.style.display = want === 'sleep' ? '' : 'none');
      if (!dlLog.length) {
        $('dlList').innerHTML = '<div class="empty">Nothing downloaded yet.<br>Files you save will show up here.</div>';
      }
    }
    $('dlList').addEventListener('click', e => {
      const row = e.target.closest('.dl');
      if (!row) return;
      const key = +row.dataset.key;
      const btn = e.target.closest('button[data-a]');
      if (btn) {
        e.stopPropagation();
        if (btn.dataset.a === 'cancel') post('CancelDownload', { download_id: +row.dataset.live });
        else post('DownloadAction', { key, action: btn.dataset.a });
      } else if (row.classList.contains('can-open')) {
        post('DownloadAction', { key, action: 'open' });
        if (!docked) post('CloseSidebar');
      }
    });

    /* Dark websites */
    let D = null;
    const SLIDERS = [['dkBrightness', 'brightness', '%'], ['dkContrast', 'contrast', '%'], ['dkSepia', 'sepia', '%'], ['dkGrayscale', 'grayscale', '%'], ['dkStroke', 'text_stroke', '']];
    let sendTimer = 0, pendingSend = null;
    function target() { return D && D.site === 'custom' ? D.host : null; }
    function edit(patch) {
      if (!D) return;
      D.theme = Object.assign({}, D.theme, patch);
      if (!('preset' in patch)) D.theme.preset = 'custom';
      pendingSend = { host: target(), theme: D.theme };
      clearTimeout(sendTimer);
      // Dragging a slider sends a few updates a second so pages follow along live.
      sendTimer = setTimeout(flush, 90);
      renderDark(true);
    }
    function flush() { if (pendingSend) { post('SetDarkTheme', pendingSend); pendingSend = null; } }
    function renderDark(local) {
      if (!D) return;
      const t = D.theme;
      $('dkOn').setAttribute('aria-checked', String(D.on));
      $('dkSite').hidden = !D.host;
      $('dkHost').textContent = D.host || '';
      for (const [id, key] of [['dkSiteDark', 'dark'], ['dkSiteLight', 'light'], ['dkSiteCustom', 'custom']]) {
        $(id).setAttribute('aria-checked', String(D.site === key));
      }
      $('dkScope').textContent = D.site === 'custom' ? 'Only for ' + D.host : 'All sites';
      document.querySelectorAll('#dkPresets .preset').forEach(b => b.setAttribute('aria-checked', String(b.dataset.id === t.preset)));
      $('dkModeDark').setAttribute('aria-checked', String(t.mode !== 'light'));
      $('dkModeLight').setAttribute('aria-checked', String(t.mode === 'light'));
      for (const [id, key, unit] of SLIDERS) {
        const el = $(id);
        if (document.activeElement !== el) el.value = t[key];
        el.nextElementSibling.textContent = t[key] + unit;
      }
      if (document.activeElement !== $('dkBackground')) $('dkBackground').value = t.background;
      if (document.activeElement !== $('dkText')) $('dkText').value = t.text;
      if (document.activeElement !== $('dkFont')) $('dkFont').value = t.use_font ? t.font_family : '';
      $('dkSchedOn').setAttribute('aria-checked', String(D.schedule.enabled));
      $('dkTimes').hidden = !D.schedule.enabled;
      if (!local) {
        if (document.activeElement !== $('dkFrom')) $('dkFrom').value = D.schedule.from;
        if (document.activeElement !== $('dkTo')) $('dkTo').value = D.schedule.to;
      }
      document.getElementById('dkLook').style.opacity = D.on ? '' : '.55';
    }
    window.__darkPanel = d => {
      if (pendingSend) return; // our own edit is still on its way; its echo will follow
      const first = !D;
      D = d;
      if (first) buildPresets();
      renderDark(false);
    };
    function buildPresets() {
      $('dkPresets').innerHTML = D.presets.map(p =>
        `<button class="preset" role="radio" data-id="${p.preset}" aria-checked="false" title="${p.preset}"><i style="background:${p.background};color:${p.text}">Aa</i>${p.preset[0].toUpperCase() + p.preset.slice(1)}</button>`).join('');
      $('dkPresets').onclick = e => {
        const b = e.target.closest('.preset');
        if (!b) return;
        const p = D.presets.find(x => x.preset === b.dataset.id);
        if (p) edit(Object.assign({}, p, { preset: p.preset }));
      };
    }
    $('dkOn').onclick = () => post('SetDarkWebsites', { on: !D.on });
    $('dkSiteDark').onclick = () => D && D.host && post('ResetDarkSite', { host: D.host });
    $('dkSiteLight').onclick = () => { if (D && D.host && D.site !== 'light') post('ToggleDarkSite', { host: D.host }); };
    $('dkSiteCustom').onclick = () => { if (D && D.host && D.site !== 'custom') post('SetDarkTheme', { host: D.host, theme: D.theme }); };
    $('dkModeDark').onclick = () => edit({ mode: 'dark' });
    $('dkModeLight').onclick = () => edit({ mode: 'light' });
    for (const [id, key] of SLIDERS) $(id).addEventListener('input', e => edit({ [key]: +e.target.value }));
    $('dkBackground').addEventListener('input', e => edit({ background: e.target.value }));
    $('dkText').addEventListener('input', e => edit({ text: e.target.value }));
    (() => {
      const sel = $('dkFont');
      const none = document.createElement('option');
      none.value = ''; none.textContent = 'Page default';
      sel.prepend(none);
      sel.addEventListener('change', () => edit(sel.value ? { use_font: true, font_family: sel.value } : { use_font: false }));
    })();
    const sched = () => post('SetDarkSchedule', { enabled: D.schedule.enabled, from: $('dkFrom').value || '20:00', to: $('dkTo').value || '07:00' });
    $('dkSchedOn').onclick = () => { D.schedule.enabled = !D.schedule.enabled; renderDark(true); sched(); };
    $('dkFrom').addEventListener('change', sched);
    $('dkTo').addEventListener('change', sched);
    $('dkReset').onclick = () => { if (D) edit(Object.assign({}, D.presets[0], { preset: 'sumi' })); };

    renderDownloads();
    reportHeight();
  </script>
</body>
</html>
