<!DOCTYPE html>
<html lang="en" data-accent="{{ACCENT}}" data-mode="{{MODE}}" data-fonts="{{FONTS}}">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>
  <style>
{{THEME_CSS}}
    html, body { height: 100%; }
    body { display: grid; place-items: center; padding: 32px; font-size: 14px; }
    main { max-width: 520px; }
    .mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--tone-ink, var(--accent)); }
    .mark.danger { color: var(--danger); }
    .mark svg.i { width: 20px; height: 20px; }
    h1 { margin: 22px 0 10px; font-family: var(--font-display); font-size: 24px; font-weight: 400; }
    p { font-family: var(--font-text); color: var(--ink-2); line-height: 1.65; }
    p strong { color: var(--ink); font-weight: 600; word-break: break-all; }
    .stage { position: relative; width: 84px; height: 84px; margin-bottom: 8px; }
    .stage .crane { width: 84px; height: 84px; }
    .stage .zzz { top: 6px; left: 62px; font-size: 20px; }
    .stage .zzz:nth-of-type(2) { top: -6px; left: 78px; }
    .uri { margin-top: 18px; padding: 9px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 10px; margin-top: 26px; }
    button { height: 36px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { border-color: var(--line-strong); }
    button.primary { background: var(--tone); border-color: transparent; color: var(--on-tone); font-weight: 600; }
    button.link { border: 0; background: none; color: var(--ink-3); padding: 0 6px; }
    button.link:hover { color: var(--danger); }
    details { margin-top: 22px; color: var(--ink-3); font-size: 12.5px; }
    details summary { cursor: pointer; width: fit-content; }
    details p { margin: 10px 0 12px; font-size: 12.5px; }
  </style>
</head>
<body>
  <main>{{BODY}}</main>
  <script>
    function post(action, payload = null) {
      if (window.ipc) window.ipc.postMessage(JSON.stringify({ action, payload }));
    }
  </script>
</body>
</html>
