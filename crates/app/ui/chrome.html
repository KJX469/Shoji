<!DOCTYPE html>
<html lang="en" data-accent="{{ACCENT}}" data-mode="{{MODE}}" data-fonts="{{FONTS}}" data-frost="{{FROST}}">
<head>
  <meta charset="UTF-8">
  <title>Shoji</title>
  <style>
{{THEME_CSS}}
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; font-size: 12.5px; user-select: none; background: var(--bg-sunk); }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus:not(:focus-visible) { outline: none; }

    /* Title bar: tabs share the top row with the window controls, like a shoji frame's top rail */
    .titlebar { position: relative; display: flex; align-items: flex-end; height: 44px; flex-shrink: 0; app-region: drag; }
    .ws-pill, .tab, .new-tab, .caption button, .resize-top { app-region: no-drag; }
    .tab-strip { flex: 1; min-width: 0; display: flex; align-items: flex-end; height: 100%; padding-left: 8px; overflow: hidden; }
    .ws-pill { align-self: center; display: flex; align-items: center; gap: 7px; height: 30px; max-width: 140px; margin: 0 4px 0 0; padding: 0 9px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font-size: 12.5px; font-weight: 600; flex-shrink: 0; transition: background .12s, border-color .12s; }
    .ws-pill[hidden] { display: none; }
    .ws-pill:hover { background: var(--hover); }
    .ws-pill.drop-ws { border-color: var(--accent); box-shadow: 0 0 0 2px var(--tint-soft); }
    .ws-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ws, var(--tone)); flex-shrink: 0; }
    #wsName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Many tabs scroll sideways (wheel, or the active tab is scrolled into view) rather than
       sliding under the new-tab button and window controls. */
    #tabs { display: flex; align-items: flex-end; flex: 0 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #tabs::-webkit-scrollbar { display: none; }
    .drag { flex: 1; min-width: 48px; height: 100%; }
    .caption { display: flex; flex-shrink: 0; height: 100%; align-self: flex-start; }
    .caption button { width: 46px; height: 100%; display: grid; place-items: center; color: var(--ink-2); font: 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; transition: background .1s, color .1s; }
    .caption button:hover { background: var(--hover); color: var(--ink); }
    .caption button:active { background: var(--press); }
    .caption #winClose:hover { background: #c42b1c; color: #fff; }
    .caption #winClose:active { background: #b02a1d; color: #fff; }
    body.inactive .tab-strip, body.inactive .caption { opacity: .55; }
    .resize-top { position: absolute; top: 0; left: 0; right: 138px; height: 4px; cursor: n-resize; z-index: 5; }
    body.maximized .resize-top { display: none; }
    /* Tabs: higher-contrast pills so each one reads as a separate target */
    :root { --tab-ink: color-mix(in srgb, var(--ink) 94%, var(--surface)); --tab-ink-dim: color-mix(in srgb, var(--ink) 88%, var(--surface)); --tab-bg: color-mix(in srgb, var(--ink) 9%, var(--bg-sunk)); --tab-bg-hover: color-mix(in srgb, var(--ink) 15%, var(--bg-sunk)); --tab-edge: color-mix(in srgb, var(--ink) 24%, transparent); }
    .tab { position: relative; display: flex; align-items: center; gap: 9px; height: 36px; width: 240px; flex: 0 1 240px; min-width: 46px; margin: 0 1px; padding: 0 10px 0 14px; container-type: inline-size; border-radius: 10px 10px 0 0; font-size: 13.5px; font-weight: 500; background: var(--tab-bg); color: var(--tab-ink-dim); box-shadow: inset 0 0 0 1px var(--tab-edge); cursor: default; transition: background .12s, color .12s; }
    .tab:hover:not(.active) { background: var(--tab-bg-hover); color: var(--tab-ink); }
    .tab.active { background: var(--surface); color: var(--tab-ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--tab-edge), 0 -1px 0 var(--surface); }
    .tab.active::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
    .tab * { pointer-events: none; }
    .tab .close, .tab .audio { pointer-events: auto; }
    /* The strip clips whatever leaves it, so a dragged tab is lifted by colour, not by a shadow that would be cut */
    .dragging { opacity: .96; z-index: 4; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent); cursor: grabbing; transition: none; }
    /* A tab dragged in from another window: the tabs part and an empty slot waits for it */
    #dropBar { position: absolute; top: 8px; height: 36px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px; border-radius: 10px 10px 0 0; font-size: 13.5px; font-weight: 600; color: var(--tab-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--accent) 22%, var(--surface)); box-shadow: inset 0 0 0 2px var(--accent); z-index: 6; pointer-events: none; opacity: 0; transform: scaleX(.6); transform-origin: 50% 100%; transition: opacity .14s, transform .18s cubic-bezier(.2, .8, .2, 1), left .14s cubic-bezier(.2, .8, .2, 1), width .14s; }
    #dropBar.on { opacity: 1; transform: none; }
    #dropBar[hidden] { display: none; }
    /* The tab being dragged in: it follows the pointer along the strip and settles into the gap on release */
    #dropGhost { position: absolute; top: 8px; left: 0; height: 36px; width: 200px; box-sizing: border-box; display: flex; align-items: center; gap: 9px; padding: 0 12px 0 14px; border-radius: 10px 10px 0 0; font-size: 13.5px; font-weight: 600; color: var(--tab-ink); white-space: nowrap; background: var(--surface); box-shadow: 0 8px 22px rgba(0,0,0,.35), inset 0 0 0 1px var(--tab-edge), inset 0 3px 0 var(--accent); z-index: 7; pointer-events: none; opacity: 0; transform: translateX(var(--gx, 0px)) translateY(6px) scale(.94); transform-origin: 50% 100%; transition: opacity .12s, transform .08s linear; will-change: transform; }
    #dropGhost.on { opacity: 1; transform: translateX(var(--gx, 0px)) scale(1); }
    #dropGhost.settle { transition: opacity .16s, transform .22s cubic-bezier(.22, 1, .36, 1); }
    #dropGhost[hidden] { display: none; }
    #dropGhost img { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; object-fit: contain; }
    #dropGhost span { overflow: hidden; text-overflow: ellipsis; }
    #tabs .parting { transition: transform .22s cubic-bezier(.22, 1, .36, 1); }
    /* A tab that has just joined the strip settles into its place */
    .tab.arriving { animation: tab-arrive .26s cubic-bezier(.22, 1, .36, 1); transform-origin: 50% 100%; }
    @keyframes tab-arrive { from { opacity: 0; transform: translateY(7px) scale(.9, .86); } }
    .tab { touch-action: none; }
    /* A tab in a container carries its colour as a thin line along the bottom edge. */
    .tab .ctr { position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--ctr); pointer-events: none; }
    .tab.pinned .ctr { left: 10px; right: 10px; }
    .tab[data-group] .ctr { bottom: 5px; }
    .tab.drop-left { outline: 3px solid var(--accent); outline-offset: -3px; clip-path: inset(0 0 0 0); }
    .tab.drop-right { outline: 3px solid var(--accent); outline-offset: -3px; }
    .favicon { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; object-fit: contain; }
    .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 12px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 12px), transparent); }
    .close { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: var(--tab-ink-dim); opacity: 0; transition: opacity .12s, background .12s; }
    .tab:hover .close, .tab.active .close { opacity: 1; }
    .close:hover { background: var(--press); color: var(--ink); }
    /* An idle tab gives the close button's space to its title */
    .tab:not(.active):not(:hover) .close { display: none; }
    .close svg.i { width: 15px; height: 15px; stroke-width: 2; }
    .new-tab { display: grid; place-items: center; width: 34px; height: 34px; margin: 0 0 3px 6px; border-radius: 9px; color: var(--tab-ink-dim); flex-shrink: 0; }
    .new-tab:hover { background: var(--hover); color: var(--ink); }
    .new-tab svg.i { width: 18px; height: 18px; }

    /* Navigation bar */
    .nav { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .btn { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px; color: var(--ink-2); flex-shrink: 0; transition: background .12s, color .12s; }
    .btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
    .btn:active:not(:disabled) { background: var(--press); }
    .btn:disabled { opacity: .35; cursor: default; }
    /* Back and forward: one solid arrow, turned round for back */
    svg.i.arrow, .pb.back svg.i, .pb.fwd svg.i { fill: currentColor; stroke-width: 1.2; }
    svg.i.arrow { width: 20px; height: 20px; }
    svg.i.arrow.back, .pb.back svg.i { transform: scaleX(-1); }
    .omni { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; margin: 0 6px; }
    .lock { position: absolute; left: 4px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: var(--ink-3); z-index: 1; }
    .lock:hover { background: var(--hover); color: var(--ink); }
    .lock svg.i { width: 14px; height: 14px; }
    svg.i.eng { stroke: none; }
    .lock svg.eng { width: 16px; height: 16px; }
    .inshield { position: absolute; right: 4px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: var(--ink-2); z-index: 1; transition: background .12s, color .12s; }
    .inshield:hover { background: var(--hover); color: var(--ink); }
    .inshield svg.i { width: 15px; height: 15px; }
    .lock.insecure { color: var(--warn); }
    #omnibox { width: 100%; height: 34px; padding: 0 36px 0 34px; border-radius: 8px; border: 1px solid transparent; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; outline: none; user-select: text; transition: border-color .15s, background .15s, box-shadow .15s; }
    #omnibox::placeholder { color: var(--ink-3); }
    #omnibox:hover { border-color: var(--line); }
    #omnibox:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint-soft); }
    .marks { position: absolute; right: 32px; display: flex; align-items: center; gap: 4px; }
    .quiet { display: grid; place-items: center; width: 24px; height: 22px; border-radius: 11px; color: var(--ink-2); }
    .quiet[hidden] { display: none; }
    .quiet:hover { background: var(--hover); color: var(--ink); }
    .quiet svg.i { width: 14px; height: 14px; }
    .zoom { display: flex; align-items: center; height: 22px; border-radius: 11px; background: var(--hover); font-size: 11px; color: var(--ink-2); overflow: hidden; }
    .zoom[hidden] { display: none; }
    .zoom button { height: 100%; padding: 0 7px; font-variant-numeric: tabular-nums; }
    .zoom button:hover { background: var(--press); color: var(--ink); }
    .zoom .step { display: none; }
    .zoom.expanded .step { display: block; }
    .dl-ring { position: absolute; inset: 3px; width: 24px; height: 24px; transform: rotate(-90deg); pointer-events: none; }
    .dl-ring circle { fill: none; stroke-width: 2; }
    .dl-ring .track { stroke: var(--line); }
    .dl-ring .fill { stroke: var(--accent); stroke-dasharray: 69.1; stroke-dashoffset: 69.1; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
    #btnDark.on { color: var(--accent); }
    #btnNotes.open { background: var(--tint); color: var(--ink); }
    .ext-btns { display: flex; gap: 2px; flex-shrink: 0; }
    .ext-btns:empty { display: none; }
    .ext-btns img { width: 18px; height: 18px; object-fit: contain; pointer-events: none; }
    .ext-btns .letter { font-size: 12px; font-weight: 600; }
    .dl-count { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; font-size: 9px; font-weight: 700; line-height: 14px; background: var(--tone); color: var(--on-tone); }

    /* Bookmarks bar */
    .bmbar { display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .bmbar[hidden] { display: none; }
    .bm-items { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1px; overflow: hidden; }
    .bm-items .bm-hint { color: var(--ink-3); font-size: 12px; padding: 0 8px; white-space: nowrap; }
    .bm { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; max-width: 190px; height: 26px; padding: 0 9px 0 6px; border-radius: 7px; color: var(--ink-2); font-size: 12.5px; transition: background .1s, color .1s; }
    .bm:hover { background: var(--hover); color: var(--ink); }
    .bm:active { background: var(--press); }
    .bm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bm .ico { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; flex-shrink: 0; font-size: 10px; font-weight: 700; line-height: 1;
      background: hsl(var(--h, 30) 38% 50% / .24); color: hsl(var(--h, 30) 40% 42%); }
    :root[data-mode="dark"] .bm .ico { color: hsl(var(--h, 30) 55% 70%); }
    @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) .bm .ico { color: hsl(var(--h, 30) 55% 70%); } }
    .bm.folder .ico { background: none; color: var(--ink-3); }
    .bm.folder .ico svg.i { width: 16px; height: 16px; }
    .bm.drop-before { box-shadow: inset 2px 0 0 var(--accent); }
    .bm.drop-into { background: var(--tint); }
    .bm.dragging { opacity: .45; }
    .bm-more, .bm-all { flex: 0 0 auto; height: 26px; border-radius: 7px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; padding: 0 7px; font-size: 12.5px; }
    .bm-more { width: 26px; justify-content: center; padding: 0; }
    .bm-more[hidden] { display: none; }
    .bm-more:hover, .bm-all:hover { background: var(--hover); color: var(--ink); }
    .bm-all { border-left: 1px solid var(--line); border-radius: 0 7px 7px 0; margin-left: 2px; padding-left: 10px; }
    .bm-all svg.i { width: 15px; height: 15px; }
    body.bar-on .tray { top: 124px; }
    body.bar-on.find-open #toast { top: 178px; }

    /* Private window: a quiet violet wash and a label, nothing louder */
    .priv-pill { display: none; align-self: center; align-items: center; gap: 6px; height: 26px; margin: 0 6px 0 0; padding: 0 10px 0 8px; border-radius: 13px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: #5c4b8f; background: rgba(120, 98, 190, .16); app-region: no-drag; }
    :root[data-mode="dark"] .priv-pill { color: #cdbdf5; background: rgba(150, 126, 220, .22); }
    @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) .priv-pill { color: #cdbdf5; background: rgba(150, 126, 220, .22); } }
    .priv-pill svg.i { width: 15px; height: 15px; }
    body.private .priv-pill { display: flex; }
    body.private .titlebar { background: color-mix(in srgb, #7a64c2 16%, var(--bg-sunk)); }

    /* Find and permission cards: float over the page (the host clips this strip to them), so
       opening one never moves or resizes the page underneath. */
    .tray { position: fixed; z-index: 20; top: 90px; display: none; align-items: center; gap: 8px; height: 46px; padding: 0 10px 0 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; }
    .tray.open { display: flex; animation: tray-in .18s cubic-bezier(.2, .8, .2, 1); }
    .tray.open.leaving { animation: tray-out .13s ease-in forwards; }
    @keyframes tray-in { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
    @keyframes tray-out { to { opacity: 0; transform: translateY(-8px) scale(.97); } }
    #findBar { right: 12px; transform-origin: top right; }
    #permissionBar { left: 12px; max-width: calc(100vw - 24px); transform-origin: top left; }
    #findInput { width: 240px; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; outline: none; user-select: text; }
    #findInput:focus { border-color: var(--accent); }
    #findCount { min-width: 48px; text-align: center; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    #permissionBar { justify-content: space-between; }
    .perm-msg { display: flex; align-items: center; gap: 10px; color: var(--ink); }
    .perm-msg svg.i { color: var(--accent); }
    .pill { height: 26px; padding: 0 14px; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .pill.primary { background: var(--tone); color: var(--on-tone); }
    .pill.primary:hover { filter: brightness(.96); }
    .pill.quiet { background: var(--surface-2); }
    .pill.quiet:hover { background: var(--press); }

    /* Loading: a small crane flaps in the tab, and a brush stroke crosses the toolbar */
    .tab-crane { display: none; width: 18px; height: 18px; flex-shrink: 0; }
    /* Stepped, not smooth: a page that loads for a long time keeps these running, and a smooth
       60 fps animation next to the title bar's drag regions made the browser's UI thread work
       flat out (a whole core, window "not responding") with several tabs open. */
    .tab.loading .tab-crane { animation: pet-waddle .7s steps(6, end) infinite alternate; }
    .tab.loading .tab-crane path:nth-of-type(2), .tab.loading .tab-crane path:nth-of-type(3) { animation: pet-flap .3s steps(3, end) infinite alternate; }
    .tab .zz { display: none; position: absolute; left: 26px; top: 4px; font: italic 600 11px var(--font-display); color: var(--ink-3); pointer-events: none; }
    .tab.asleep .zz { display: block; opacity: .8; }
    .tab.asleep:hover .zz { animation: zz 1.3s ease-in-out 1; }
    .tab.asleep .favicon { opacity: .55; filter: grayscale(.8); }
    .tab.asleep .title { color: var(--ink-3); }
    @keyframes zz { 0%, 100% { opacity: 0; transform: translate(0, 3px); } 50% { opacity: 1; transform: translate(2px, -1px); } }
    .tab.loading .favicon { display: none; }
    .tab.loading .tab-crane { display: block; }
    .nav { position: relative; }
    .nav::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: 34%; border-radius: 2px; opacity: 0; pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--tone) 35%, var(--accent) 80%, transparent); }
    body.loading .nav::after { opacity: 1; animation: brush 1.5s cubic-bezier(.45, 0, .25, 1) infinite; }
    @keyframes brush { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    #btnReload .x { display: none; }
    body.loading #btnReload .reload { display: none; }
    body.loading #btnReload .x { display: block; }

    /* Closing a tab folds it away */

    /* The site seal: a small vermilion stamp that presses in when a secure page has loaded */
    .lock .seal, .lk .seal { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid var(--seal); color: var(--seal);
      font: 700 10.5px/1 "Yu Mincho", "MS Mincho", "Hiragino Mincho ProN", serif; letter-spacing: 0; }
    .lock .seal.stamp, .lk .seal.stamp { animation: stamp .42s cubic-bezier(.2, 1.5, .4, 1) both; }
    @keyframes stamp { 0% { opacity: 0; transform: scale(1.9) rotate(-14deg); } 55% { opacity: 1; transform: scale(.92) rotate(2deg); } 100% { transform: none; } }
    :root { --seal: #b8433b; }
    :root[data-mode="dark"] { --seal: #e0706a; }
    @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) { --seal: #e0706a; } }

    /* A small card with the crane, for things worth a word: a finished download, a koan */
    #toast { right: 12px; transform-origin: top right; max-width: min(460px, calc(100vw - 24px)); gap: 10px; }
    body.find-open #toast { top: 144px; }
    #toast .crane { width: 30px; height: 30px; flex-shrink: 0; }
    #toast .msg { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
    #toast .msg b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #toast .msg span { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* A letter from the crane: a newer Shoji. A sealed letter waits in the toolbar (the seal is the
       vermilion of the site stamp); its card unfolds below it once, and folds back into it. */
    #btnLetter[hidden] { display: none; }
    #btnLetter .knot { fill: var(--seal); stroke: var(--seal); }
    #btnLetter.arrive { animation: letter-drop .9s cubic-bezier(.3, 1.4, .5, 1) both; }
    #btnLetter:hover svg { animation: letter-wiggle .5s ease-in-out; }
    @keyframes letter-drop { 0% { opacity: 0; transform: translate(10px, -22px) rotate(-28deg); } 60% { opacity: 1; transform: translate(0, 2px) rotate(6deg); } 100% { transform: none; } }
    @keyframes letter-wiggle { 30% { transform: rotate(-9deg); } 70% { transform: rotate(6deg); } }
    #letter { right: 12px; width: 340px; max-width: calc(100vw - 24px); height: auto; flex-direction: column; align-items: stretch; gap: 0; padding: 14px 14px 12px 16px; transform-origin: calc(100% - 52px) -8px;
      background-image: linear-gradient(90deg, transparent calc(50% - .5px), color-mix(in srgb, var(--line) 55%, transparent) 50%, transparent calc(50% + .5px)); }
    #letter.open { animation: letter-unfold .42s cubic-bezier(.2, .9, .25, 1) both; }
    #letter.open.leaving { animation: letter-fold .32s cubic-bezier(.5, 0, .75, .4) forwards; }
    @keyframes letter-unfold { 0% { opacity: 0; transform: scale(.12, .04); } 45% { opacity: 1; transform: scale(.5, .1); } 100% { transform: none; } }
    @keyframes letter-fold { 55% { transform: scale(.5, .08); opacity: 1; } 100% { transform: scale(.08, .03); opacity: 0; } }
    #letter.open > * { animation: lt-rise .3s .22s ease both; }
    @keyframes lt-rise { from { opacity: 0; transform: translateY(4px); } }
    .lt-top { display: flex; align-items: center; gap: 12px; }
    .lt-top .crane { width: 34px; height: 34px; flex-shrink: 0; }
    .lt-msg { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.35; }
    .lt-msg b { font-family: var(--font-display); font-weight: 500; font-size: 14.5px; }
    .lt-msg span { color: var(--ink-3); font-size: 12px; }
    .lt-x { width: 26px; height: 26px; align-self: flex-start; margin: -4px -4px 0 0; }
    .lt-x .i { width: 15px; height: 15px; }
    .lt-notes { list-style: none; margin: 11px 0 0; padding: 8px 11px; border-radius: 9px; background: var(--surface-2); font-size: 12px; line-height: 1.6; color: var(--ink-2); }
    .lt-notes:empty { display: none; }
    .lt-notes li { display: flex; gap: 8px; }
    .lt-notes li::before { content: ""; flex-shrink: 0; width: 4px; height: 4px; margin-top: .62em; border-radius: 1px; background: var(--seal); transform: rotate(45deg); }
    .lt-notes li.read::before { display: none; }
    .lt-notes .read button { margin-top: 2px; padding: 0; border: 0; background: none; color: var(--ink-3); font: inherit; font-size: 11.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .lt-notes .read button:hover { color: var(--ink); }
    .lt-bar { height: 3px; margin: 12px 0 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .lt-bar i { display: block; height: 100%; width: 0; background: var(--tone); transition: width .3s ease; }
    .lt-bar[hidden], .lt-acts:empty, .lt-foot:empty, .lt-err[hidden] { display: none; }
    .lt-err { margin-top: 10px; padding: 7px 10px; border-radius: 8px; background: var(--tint-soft); color: var(--ink-2); font-size: 11.5px; line-height: 1.45; }
    .lt-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .lt-acts .pill { height: 28px; padding: 0 12px; }
    .lt-acts .pill.plain { background: none; color: var(--ink-2); }
    .lt-acts .pill.plain:hover { background: var(--hover); color: var(--ink); }
    .lt-foot { margin-top: 8px; text-align: right; }
    .lt-foot button { padding: 0; border: 0; background: none; color: var(--ink-3); font: inherit; font-size: 11.5px; cursor: pointer; }
    .lt-foot button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    /* Tab groups: a coloured label ahead of the first tab, and a coloured line under each tab */
    .group-chip { align-self: center; flex: 0 0 auto; display: block; line-height: 28px; max-width: 150px; height: 28px; margin: 0 3px 0 8px; padding: 0 13px; border-radius: 14px; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--g-on, #fff); background: var(--g-deep, var(--g, var(--tone))); box-shadow: 0 1px 0 rgba(0,0,0,.18); app-region: no-drag; cursor: default; }
    .tab[data-group] { background: color-mix(in srgb, var(--g-deep, var(--g)) 16%, var(--tab-bg)); }
    .tab.active[data-group] { background: color-mix(in srgb, var(--g-deep, var(--g)) 9%, var(--surface)); }
    .tab[data-group]::before { content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 4px; border-radius: 3px 3px 0 0; background: var(--g-deep, var(--g)); }
    .tab.active[data-group]::before { top: auto; left: 6px; right: 6px; height: 4px; background: var(--g-deep, var(--g)); }
    .tab .audio { display: none; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--tab-ink-dim); flex-shrink: 0; align-items: center; justify-content: center; pointer-events: auto; }
    .tab .audio:hover { background: var(--hover); color: var(--ink); }
    .tab .audio .i { width: 17px; height: 17px; }
    .tab .audio .off { display: none; }
    .tab.sound .audio { display: flex; }
    .tab.muted .audio { display: flex; }
    .tab.muted .audio .on { display: none; }
    .tab.muted .audio .off { display: inline; }
    .tab.pinned { width: 48px; flex: 0 0 48px; min-width: 48px; padding: 0; justify-content: center; }
    .tab.pinned .title, .tab.pinned .close, .tab.pinned .zz { display: none; }
    .tab.pinned .audio { position: absolute; right: -2px; bottom: 2px; width: 20px; height: 20px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--tab-edge); }
    .tab.pinned .audio .i { width: 13px; height: 13px; }
    /* Split view: one combined tab. Each pane is an ordinary tab (favicon, title, mute, close) inside a shared
       pill; a badge on the seam between neighbours (L|R, or 1|2, 2|3...) tells the panes apart without
       touching a favicon. The usual accent bar runs over the whole pill; under the selected pane it drops
       down both seams and runs beneath that pane instead. */
    .split-tab { --sd: var(--accent); --sbg: color-mix(in srgb, var(--sd) 13%, var(--bg-sunk)); position: relative; display: flex; align-items: stretch; align-self: flex-end; flex: 0 1 auto; min-width: calc(var(--n, 2) * 54px + (var(--n, 2) - 1) * 24px); height: 36px; margin: 0 1px; border-radius: 10px 10px 0 0; background: var(--sbg); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--sd) 70%, var(--tab-edge)); app-region: no-drag; overflow: hidden; }
    .split-tab::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--sd); opacity: .55; pointer-events: none; z-index: 1; }
    .split-tab > .tab { width: 200px; flex: 1 1 200px; min-width: 54px; margin: 0; padding: 0 8px 0 12px; border-radius: 0; background: transparent; box-shadow: none; container-type: inline-size; }
    .split-tab > .tab:first-child { border-top-left-radius: 10px; }
    .split-tab > .tab:last-child { border-top-right-radius: 10px; }
    .split-tab > .tab:hover:not(.active) { background: color-mix(in srgb, var(--sd) 12%, transparent); }
    .split-tab > .tab.active { background: var(--surface); box-shadow: none; }
    .split-tab > .tab.active::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--sd); z-index: 2; }
    .seam { position: relative; flex: 0 0 24px; align-self: stretch; cursor: pointer; z-index: 3; }
    .seam::before { content: ""; position: absolute; left: 50%; top: 7px; bottom: 7px; width: 1px; margin-left: -.5px; background: color-mix(in srgb, var(--sd) 55%, transparent); }
    .seam .badge { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; align-items: center; border-radius: 50%; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 1.5px var(--sd); font: 700 8.5px/1 var(--font); color: var(--ink); z-index: 3; transition: transform .16s cubic-bezier(.22, 1, .36, 1); }
    .seam .badge i { font-style: normal; text-align: center; }
    .seam .badge::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--sd); }
    .seam:hover .badge { transform: scale(1.18); }
    .split-tab.dense .seam { flex-basis: 18px; }
    .split-tab.dense .seam .badge { width: 16px; height: 16px; margin: -8px 0 0 -8px; font-size: 7px; }
    .split-tab > .tab .title { }
    /* Narrow panes keep favicon and close; narrower still, only the favicon */
    @container (max-width: 112px) { .title, .tab-crane + .zz { display: none; } .audio { display: none !important; } }
    @container (max-width: 64px) { .close { display: none !important; } }
    .split-tab.merging { animation: split-merge .5s cubic-bezier(.22, 1, .36, 1); }
    .split-tab.merging .seam .badge { animation: badge-pop .5s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes split-merge { from { box-shadow: inset 0 0 0 1px transparent; background: transparent; } }
    @keyframes badge-pop { from { transform: scale(0); } 60% { transform: scale(1.25); } }
    .split-tab.join-target { box-shadow: inset 0 0 0 2px var(--sd), 0 0 0 3px color-mix(in srgb, var(--sd) 35%, transparent); }
    .tab[data-group]:not(.active) { color: var(--tab-ink); }
    .split-ctl { display: flex; align-items: center; gap: 1px; height: 26px; padding: 0 3px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); flex-shrink: 0; }
    .split-ctl[hidden] { display: none; }
    .split-ctl button { height: 22px; padding: 0 6px; border-radius: 5px; font-size: 11px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
    .split-ctl button:hover { background: var(--hover); color: var(--ink); }
    .split-ctl svg.i { width: 14px; height: 14px; }


    /* Split view toolbars: one bar above each pane (back, forward, reload, address, favourite, dark mode),
       and the window-wide buttons move up beside the window controls. */
    #paneBars { display: none; position: absolute; inset: 0; }
    .tools-host { display: none; align-items: center; gap: 2px; height: 100%; padding: 0 6px; flex-shrink: 0; align-self: flex-start; }
    .tools-host, .tools-host * { app-region: no-drag; }
    .tools-host .btn { height: 32px; }
    body.splitbars .tools-host { display: flex; }
    body.splitbars #paneBars { display: block; }
    body.splitbars .nav { position: relative; padding: 0; gap: 0; }
    body.splitbars #btnBack, body.splitbars #btnForward, body.splitbars #btnReload, body.splitbars .omni, body.splitbars #btnFav, body.splitbars #btnDark, body.splitbars #btnReader, body.splitbars #btnPip, body.splitbars #btnShield { display: none; }
    .pbar { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: 2px; padding: 0 5px; box-sizing: border-box; min-width: 0; overflow: visible; border-left: 1px solid var(--line); }
    .pbar:first-child { border-left: 0; }
    .pbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--sd, var(--accent)); opacity: 0; transition: opacity .15s; }
    .pbar.active::after { opacity: 1; }
    .pb { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; color: var(--ink-2); flex-shrink: 0; transition: background .12s, color .12s; }
    .pb:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
    .pb:disabled { opacity: .35; cursor: default; }
    .pb svg.i { width: 17px; height: 17px; }
    .pb[hidden] { display: none; }
    .pb.on { color: var(--accent); }
    .pb.shield[data-state="off"], .pb.shield[data-state="paused"] { color: var(--ink-3); }
    .pb.shield .slash { display: none; }
    .pb.shield[data-state="off"] .slash, .pb.shield[data-state="paused"] .slash { display: inline; }
    .pb.shield[data-state="off"] .check, .pb.shield[data-state="paused"] .check { display: none; }
    .pb .cnt { position: absolute; top: 0; right: -2px; min-width: 13px; height: 13px; padding: 0 3px; border-radius: 7px; background: var(--ink); color: var(--surface); font-size: 9px; font-weight: 600; line-height: 13px; text-align: center; pointer-events: none; }
    .pb .cnt[hidden] { display: none; }
    .pb.reload .x { display: none; }
    .pbar.loading .pb.reload .x { display: block; }
    .pbar.loading .pb.reload .rl { display: none; }
    .pa { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
    .pa .lk { position: absolute; left: 4px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--ink-3); z-index: 1; }
    .pa .lk svg.i { width: 14px; height: 14px; }
    .pa .lk svg.eng { width: 16px; height: 16px; }
    .pa .pb.shield { position: absolute; right: 4px; width: 24px; height: 24px; z-index: 1; border-radius: 6px; }
    .pa .pb.shield svg.i { width: 15px; height: 15px; }
    .pa .pb.shield:not([hidden]) { display: grid; }
    .pa .pb.shield .cnt { top: -3px; right: -5px; }
    .pa .lk.insecure { color: var(--warn); }
    .paddr { width: 100%; height: 34px; padding: 0 34px 0 34px; border-radius: 8px; border: 1px solid transparent; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; outline: none; user-select: text; text-overflow: ellipsis; transition: border-color .15s, background .15s, box-shadow .15s; }
    .paddr:hover { border-color: var(--line); }
    .paddr:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint-soft); }
    .pbar.tiny .lk, .pbar.tiny .pb.shield { display: none; }
    .pbar.tiny .paddr { padding: 0 8px; }
    .pmenu { position: fixed; z-index: 30; min-width: 170px; padding: 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: tray-in .14s cubic-bezier(.2, .8, .2, 1); }
    .pmenu button { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 10px; border-radius: 6px; color: var(--ink); font-size: 12.5px; text-align: left; }
    .pmenu button:hover { background: var(--hover); }
    .pmenu button:disabled { opacity: .4; }
    .pmenu svg.i { width: 15px; height: 15px; flex-shrink: 0; }

    /* Favourite / reader / picture-in-picture buttons */
    #btnFav.on { color: var(--accent); }
    #btnReader.on { background: var(--tint); color: var(--ink); }
    #btnPip[hidden], #btnReader[hidden] { display: none; }

    /* Byobu shield: outline when idle, filled chip with a count while it is blocking */
    #btnShield[data-state="off"], #btnShield[data-state="paused"] { color: var(--ink-3); }
    #btnShield .slash { display: none; }
    #btnShield[data-state="off"] .slash, #btnShield[data-state="paused"] .slash { display: inline; }
    #btnShield[data-state="off"] .check, #btnShield[data-state="paused"] .check { display: none; }
    #btnShield.busy { background: var(--tint); color: var(--ink); }
    #btnShield .count { position: absolute; top: -2px; right: -3px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--ink); color: var(--surface); font-size: 9.5px; font-weight: 600; line-height: 14px; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
    #btnShield .count[hidden] { display: none; }

    /* Page-tinted toolbar: a soft wash of the site's own colour over the toolbar rows */
    html[data-tint] .nav { background: color-mix(in srgb, var(--page-tint) 16%, var(--surface)); }
    html[data-tint] body { background: color-mix(in srgb, var(--page-tint) 22%, var(--bg-sunk)); }
    html[data-tint] .tab.active { background: color-mix(in srgb, var(--page-tint) 16%, var(--surface)); }
    html[data-tint] .tab:not(.active):not([data-group]) { background: color-mix(in srgb, var(--page-tint) 10%, var(--tab-bg)); }
    .nav, .tray, body, .tab.active { transition: background-color .25s; }

    /* Windows 11 frosted toolbar: the window's Mica backdrop shows through */
    html[data-frost="1"], html[data-frost="1"] body { background: var(--bg-sunk); }
    html[data-frost="1"] .nav { background: color-mix(in srgb, var(--surface) 60%, transparent); border-bottom-color: transparent; }
    html[data-frost="1"] .tab.active { background: color-mix(in srgb, var(--surface) 82%, transparent); }
    html[data-frost="1"] .tab:not(.active):not([data-group]) { background: color-mix(in srgb, var(--ink) 12%, transparent); }
    html[data-frost="1"] #omnibox { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
  </style>
</head>
<body class="{{BODY_CLASS}}">
  <div class="titlebar">
    <div class="resize-top" onmousedown="if (event.button === 0) post('StartWindowResize')"></div>
    <div class="tab-strip" id="tabStrip">
      <div class="priv-pill" title="Private window: cookies, history and sign-ins are not kept">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 11c1.5-4 3.5-5.5 8-5.5S18.500 7 20 11M3 11h18M7 17.500a2.500 2.500 0 1 0 0-5 2.500 2.500 0 0 0 0 5zM17 17.500a2.500 2.500 0 1 0 0-5 2.500 2.500 0 0 0 0 5zM9.500 15h5"/></svg>Private
      </div>
      <button class="ws-pill" id="wsPill" onclick="post('ToggleWorkspacesSidebar')" oncontextmenu="event.preventDefault(); openWsMenu(event)" title="Spaces (Alt+W)" aria-label="Workspace">
        <span class="ws-dot" id="wsDot"></span>
        <span id="wsName">Main</span>
      </button>
      <div id="tabs" role="tablist" aria-label="Tabs"></div>
      <button class="new-tab" onclick="post('CreateTab', { url: null })" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="drag" id="dragArea"></div>
    </div>
    <div class="tools-host" id="toolsHost"></div>
    <div class="caption">
      <button id="winMin" onclick="post('MinimizeWindow')" title="Minimize" aria-label="Minimize">&#xE921;</button>
      <button id="winMax" onclick="post('ToggleMaximize')" title="Maximize" aria-label="Maximize">&#xE922;</button>
      <button id="winClose" onclick="post('CloseWindow')" title="Close" aria-label="Close">&#xE8BB;</button>
    </div>
  </div>

  <div class="nav" role="toolbar" aria-label="Navigation">
    <div id="paneBars"></div>
    <button class="btn" id="btnBack" onclick="post('GoBack')" disabled title="Back (Alt+Left)" aria-label="Back">
      <svg class="i arrow back" viewBox="0 0 24 24"><path d="M3.6 9.5h8.1V5.7c0-.9 1.1-1.4 1.8-.8l7 6.1c.5.5.5 1.1 0 1.6l-7 6.1c-.7.6-1.8.1-1.8-.8v-3.8H3.6c-.6 0-1.1-.5-1.1-1.1v-3.2c0-.6.5-1.1 1.1-1.1z"/></svg>
    </button>
    <button class="btn" id="btnForward" onclick="post('GoForward')" disabled title="Forward (Alt+Right)" aria-label="Forward">
      <svg class="i arrow" viewBox="0 0 24 24"><path d="M3.6 9.5h8.1V5.7c0-.9 1.1-1.4 1.8-.8l7 6.1c.5.5.5 1.1 0 1.6l-7 6.1c-.7.6-1.8.1-1.8-.8v-3.8H3.6c-.6 0-1.1-.5-1.1-1.1v-3.2c0-.6.5-1.1 1.1-1.1z"/></svg>
    </button>
    <button class="btn" id="btnReload" onclick="post(document.body.classList.contains('loading') ? 'Stop' : 'Reload')" title="Reload (Ctrl+R)" aria-label="Reload">
      <svg class="i reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      <svg class="i x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="omni">
      <button class="lock" id="btnLock" onclick="lockClick(this)" title="Site information" aria-label="Site information">
        <svg class="i" viewBox="0 0 24 24" id="lockIcon"></svg>
      </button>
      <button class="inshield" id="btnShield" onclick="post('ToggleShieldPanel')" title="Byōbu shield" aria-label="Byōbu shield">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.3-3 7.7-7 9.5-4-1.8-7-5.2-7-9.5V6z"/><path class="check" d="M9 12l2 2 4-4"/><path class="slash" d="M5 4l14 16"/></svg>
      <span class="count" id="shieldCount">0</span>
    </button>
      <input id="omnibox" type="text" spellcheck="false" autocomplete="off" aria-label="Address and search"
             placeholder="Search {{SEARCH_ENGINE_NAME}} or type a URL" onkeydown="omniKey(event)"
             oninput="curOmni = this; omniInput()" onfocus="omniFocus(this)" onblur="omniBlur(this)">
      <div class="marks">
      <button class="quiet" id="quietMark" hidden onclick="allowQuiet()" aria-label="Notifications blocked">
        <svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/><path d="M4 4l16 16"/></svg>
      </button>
      <div class="zoom" id="zoom" hidden onmouseenter="this.classList.add('expanded')" onmouseleave="this.classList.remove('expanded')">
        <button class="step" onclick="post('ZoomOut')" title="Zoom out (Ctrl+-)">−</button>
        <button onclick="post('ZoomReset')" id="zoomReset" title="Reset zoom (Ctrl+0)">100%</button>
        <button class="step" onclick="post('ZoomIn')" title="Zoom in (Ctrl++)">+</button>
      </div>
      </div>
    </div>

    <div class="split-ctl" id="splitCtl" hidden>
      <button id="btnSplitOrient" onclick="post('ToggleSplitOrientation')" ondblclick="post('ResetSplitRatio')" title="Flip split orientation (Alt+Shift+S)" aria-label="Flip split orientation">
        <svg class="i" viewBox="0 0 24 24" id="splitOrientIcon"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
        <span id="splitRatioText">50/50</span>
      </button>
      <button onclick="post('ResetSplitRatio')" title="Even out the panes" aria-label="Even out the panes">=</button>
      <button onclick="post('ToggleSplit')" title="Add a tab to this split (Ctrl+Shift+S)" aria-label="Add a tab to this split">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button onclick="post('SplitWith', { tab_id: null })" title="Exit split view (Ctrl+Shift+S)" aria-label="Exit split view">
        <svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>

    <button class="btn" id="btnFav" onclick="post('ToggleFavourite')" title="Bookmark this tab (Ctrl+D)" aria-label="Bookmark this tab">
      <svg class="i" viewBox="0 0 24 24" id="favIcon"></svg>
    </button>
    <button class="btn" id="btnReader" onclick="post('ToggleReader')" title="Reader view (F9)" aria-label="Reader view">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>
    </button>
    <button class="btn" id="btnPip" onclick="post('TogglePictureInPicture')" title="Picture in picture" aria-label="Picture in picture" hidden>
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="btnDark" onclick="post('ToggleDarkPanel')" oncontextmenu="event.preventDefault(); toggleDarkSite()" aria-label="Dark websites">

    /* Move the window-wide buttons next to the window controls while panes have their own bars */
    function setSplitBars(on) {
      if (on === splitBarsOn) return;
      splitBarsOn = on;
      document.body.classList.toggle('splitbars', on);
      toolMarks.forEach(([n, m]) => { if (on) $('toolsHost').appendChild(n); else m.after(n); });
      if (!on) { $('paneBars').textContent = ''; barsKey = ''; }
      reportAnchors();
    }
    const paneAct = (id, fn) => { if (id !== activeTabId) post('SwitchTab', { id }); fn(); };
    function ensureBar(id) {
      let bar = [...$('paneBars').children].find(b => b.dataset.id === String(id));
      if (bar) return bar;
      bar = document.createElement('div');
      bar.className = 'pbar'; bar.dataset.id = id;
      const btn = (cls, label, svg, fn) => {
        const b = document.createElement('button');
        b.className = 'pb ' + cls; b.setAttribute('aria-label', label); b.title = label;
        b.innerHTML = '<svg class="i" viewBox="0 0 24 24">' + svg + '</svg>';
        b.onclick = e => { e.stopPropagation(); paneAct(id, () => fn(b)); };
        return b;
      };
      const tab = () => state.tabs.find(t => t.id === id) || {};
      const back = btn('back', 'Back', PB.back, () => post('GoBack'));
      const fwd = btn('fwd', 'Forward', PB.fwd, () => post('GoForward'));
      const reload = btn('reload', 'Reload', PB.reload, () => post(tab().is_loading ? 'Stop' : 'Reload'));
      const fav = btn('fav', 'Bookmark this tab', '<path d="M12 3.8l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17.1l-5.2 2.8 1-5.8L3.5 10l5.9-.9z"/>', () => post('ToggleFavourite'));
      const dark = btn('dark', 'Dark mode', '', () => { anchorDark = dark; post('ToggleDarkPanel'); });
      dark.oncontextmenu = e => { e.preventDefault(); const h = hostOf(tab().url || ''); if (h) post('ToggleDarkSite', { host: h }); };
      const shield = btn('shield', 'Byōbu shield', '<path d="M12 3l7 3v5.5c0 4.3-3 7.7-7 9.5-4-1.8-7-5.2-7-9.5V6z"/><path class="check" d="M9 12l2 2 4-4"/><path class="slash" d="M5 4l14 16"/>', b => { anchorDark = b; post('ToggleShieldPanel'); });
      const cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.hidden = true; shield.appendChild(cnt);
      const reader = btn('reader', 'Reader view', '<path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/>', () => post('ToggleReader'));
      const pip = btn('pip', 'Picture in picture', '<rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/>', () => post('TogglePictureInPicture'));
      pip.hidden = true; pip.dataset.na = '1';
      const more = btn('more', 'More', PB.more, b => openPaneMenu(bar, b));
      const pa = document.createElement('div');
      pa.className = 'pa';
      const lk = document.createElement('button');
      lk.className = 'lk'; lk.setAttribute('aria-label', 'Site information');
      lk.innerHTML = '<svg class="i" viewBox="0 0 24 24"></svg>';
      lk.onclick = e => { e.stopPropagation(); paneAct(id, () => lockClick(lk)); };
      const inp = document.createElement('input');
      inp.className = 'paddr'; inp.type = 'text'; inp.spellcheck = false; inp.autocomplete = 'off';
      inp.setAttribute('aria-label', 'Address and search');
      inp.onfocus = () => { curOmni = inp; if (id !== activeTabId) post('SwitchTab', { id }); omniFocus(inp); };
      inp.onblur = () => omniBlur(inp);
      inp.oninput = () => { curOmni = inp; omniInput(); };
      inp.onkeydown = omniKey;
      pa.append(lk, shield, inp);
      bar.append(back, fwd, reload, pa, fav, dark, reader, pip, more);
      bar.onmousedown = () => { if (id !== activeTabId) post('SwitchTab', { id }); };
      $('paneBars').appendChild(bar);
      return bar;
    }
    let anchorDark = null;
    function paintBars() {
      if (!splitBarsOn) return;
      const sp = state.split_state;
      if (!sp) return;
      const color = deepOf(sp.color);
      sp.panes.forEach(id => {
        const bar = ensureBar(id), tab = state.tabs.find(t => t.id === id);
        if (!tab) return;
        bar.style.setProperty('--sd', color);
        bar.classList.toggle('active', id === activeTabId);
        bar.classList.toggle('loading', !!tab.is_loading);
        const internal = isInternal(tab.url);
        const shown = internal ? '' : tab.url;
        const inp = bar.querySelector('.paddr');
        inp.dataset.url = shown;
        inp.placeholder = 'Search ' + engineName + ' or type a URL';
        if (document.activeElement !== inp) inp.value = shownUrl(shown, false);
        bar.querySelector('.back').disabled = !tab.can_go_back;
        bar.querySelector('.fwd').disabled = !tab.can_go_forward;
        const kind = internal || tab.notice ? 'shoji' : (tab.url.startsWith('https://') ? 'lock' : 'open');
        const lk = bar.querySelector('.lk');
        if (lk.dataset.kind !== kind) {
          lk.dataset.kind = kind;
          lk.className = 'lk' + (kind === 'open' ? ' insecure' : '');
          // The same marks as the single address bar: the engine's logo on a new tab, the red
          // seal on a secure page, the plain symbols otherwise.
          if (kind === 'lock') {
            lk.innerHTML = '<span class="seal' + (Pet_calm ? '' : ' stamp') + '" aria-hidden="true">\u5B89</span>';
          } else {
            lk.innerHTML = '<svg class="i' + (kind === 'shoji' ? ' eng' : '') + '" viewBox="0 0 24 24">' + (kind === 'shoji' ? (ENGINE_LOGOS[engineName.toLowerCase()] || ENGINE_LOGOS.duckduckgo) : ICONS[kind]) + '</svg>';
          }
        }
        const faved = !internal && data.favs.some(f => f.url === tab.url);
        const fav = bar.querySelector('.fav');
        fav.classList.toggle('on', faved);
        fav.querySelector('path').setAttribute('fill', faved ? 'currentColor' : 'none');
        fav.title = faved ? 'Remove bookmark' : 'Bookmark this tab';
        const host = internal ? '' : hostOf(tab.url);
        const never = !!host && siteListed(prefs.darkExclude, host);
        const always = !!host && !never && siteListed(prefs.darkInclude, host);
        const on = !never && (prefs.darkWebsites || always);
        const dark = bar.querySelector('.dark');
        dark.classList.toggle('on', on);
        dark.querySelector('svg').innerHTML = on ? MOON.replace('<path', '<path fill="currentColor"') : MOON + (never ? '<path d="M4 4l16 16"/>' : '');
        dark.title = never ? 'Dark mode: never on ' + host : always ? 'Dark mode: always on ' + host : on ? 'Dark mode: on' : 'Dark mode: off';
      });
      // Bars of tabs that left the split
      [...$('paneBars').children].forEach(b => { if (!sp.panes.includes(+b.dataset.id)) b.remove(); });
      layoutBars();
    }
    /* Place each bar over its pane, then drop what does not fit: dark mode first, then favourite,
       forward, reload, back; the address shortens last. Dropped buttons live in the "..." menu. */
    function layoutBars() {
      if (!splitBarsOn) return;
      const sp = state.split_state, rects = state.split_rects || [];
      if (!sp || rects.length !== sp.panes.length) return;
      sp.panes.forEach((id, i) => {
        const bar = [...$('paneBars').children].find(b => b.dataset.id === String(id));
        if (!bar) return;
        const r = rects[i];
        const x = Math.round(r[0] * 10) / 10, w = Math.round(r[2] * 10) / 10;
        if (bar.style.left !== x + 'px') bar.style.left = x + 'px';
        if (bar.style.width !== w + 'px') bar.style.width = w + 'px';
        // In the order they are kept; buttons that do not apply (no video, nothing to shield) take no room.
        const keep = ['back', 'reload', 'fwd', 'fav', 'dark', 'reader', 'pip'].filter(k => !bar.querySelector('.' + k).dataset.na);
        const room = w - 10 - 76 - 24;               // what is left once the address has its minimum
        let fit = Math.max(0, Math.floor((room + 2) / 34));
        const hiddenAny = fit < keep.length;
        if (hiddenAny) fit = Math.max(0, Math.floor((room - 34 + 2) / 34));
        ['back', 'reload', 'fwd', 'fav', 'dark', 'reader', 'pip'].forEach(k => { const b = bar.querySelector('.' + k); b.hidden = !!b.dataset.na || keep.indexOf(k) >= fit; });
        bar.querySelector('.more').hidden = !hiddenAny;
        bar.classList.toggle('tiny', w < 120);
      });
      reportAnchors();
    }
    function openPaneMenu(bar, anchor) {
      document.querySelectorAll('.pmenu').forEach(m => m.remove());
      const id = +bar.dataset.id;
      const tab = state.tabs.find(t => t.id === id) || {};
      const menu = document.createElement('div');
      menu.className = 'pmenu';
      const names = { back: 'Back', reload: tab.is_loading ? 'Stop' : 'Reload', fwd: 'Forward', fav: bar.querySelector('.fav').title, dark: 'Dark mode\u2026', shield: bar.querySelector('.shield').title, reader: bar.querySelector('.reader').title, pip: 'Picture in picture' };
      ['back', 'reload', 'fwd', 'fav', 'dark', 'shield', 'reader', 'pip'].forEach(k => {
        const src = bar.querySelector('.' + k);
        if (!src.hidden || src.dataset.na) return;
        const it = document.createElement('button');
        it.innerHTML = '<svg class="i" viewBox="0 0 24 24">' + src.querySelector('svg').innerHTML + '</svg><span></span>';
        it.querySelector('span').textContent = names[k];
        it.disabled = src.disabled;
        it.onclick = () => { menu.remove(); src.hidden = false; src.click(); src.hidden = true; };
        menu.appendChild(it);
      });
      document.body.appendChild(menu);
      const r = anchor.getBoundingClientRect();
      menu.style.left = Math.max(4, Math.min(innerWidth - menu.offsetWidth - 4, r.right - menu.offsetWidth)) + 'px';
      menu.style.top = (r.bottom + 4) + 'px';
      const close = e => { if (!menu.contains(e.target)) { menu.remove(); removeEventListener('mousedown', close, true); } };
      setTimeout(() => addEventListener('mousedown', close, true), 0);
    }
    /* Per-pane page state from the host: shield counts, reader on, video present */
    let paneStates = {};
    window.__paneState = list => {
      paneStates = {};
      list.forEach(p => { paneStates[p.id] = p; });
      if (!splitBarsOn) return;
      list.forEach(p => {
        const bar = [...$('paneBars').children].find(b => b.dataset.id === String(p.id));
        if (!bar) return;
        const sh = bar.querySelector('.shield'), rd = bar.querySelector('.reader'), pp = bar.querySelector('.pip');
        const shNa = p.shield === 'none' ? '1' : '';
        if ((sh.dataset.na || '') !== shNa || (pp.dataset.na || '') !== (p.video ? '' : '1')) { if (shNa) sh.dataset.na = '1'; else delete sh.dataset.na; if (p.video) delete pp.dataset.na; else pp.dataset.na = '1'; }
        sh.dataset.state = p.shield;
        const n = p.n || 0, shown = p.shield === 'on' && n > 0;
        const c = sh.querySelector('.cnt'); c.hidden = !shown; c.textContent = n > 999 ? '999+' : String(n);
        sh.title = p.shield === 'paused' ? 'Byōbu is paused on this site' : p.shield === 'off' ? 'Byōbu is off' : n > 0 ? 'Byōbu blocked ' + n + ' on this page' : 'Byōbu shield';
        rd.classList.toggle('on', !!p.reader);
        rd.title = p.reader ? 'Exit reader view' : 'Reader view';
      });
      layoutBars();
    };
    window.__splitRects = r => { state.split_rects = r; if (splitBarsOn) layoutBars(); };

    /* Keyboard navigation within the tab list */
    $('tabs').addEventListener('wheel', e => { if (e.deltaY) { $('tabs').scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
    $('tabs').addEventListener('keydown', e => {
      const tabs = stripTabs();
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      const to = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      tabs[to].focus();
      post('SwitchTab', { id: +tabs[to].id.slice(4) });
    });

    /* Window frame: empty title-bar space is an app-region drag area, handled natively by
       WebView2 + Windows (drag, double-click to maximize, right-click for the system menu). */
    window.__syncWindow = w => {
      document.body.classList.toggle('maximized', w.maximized);
      document.body.classList.toggle('inactive', !w.focused);
      $('winMax').innerHTML = w.maximized ? '&#xE923;' : '&#xE922;';
      $('winMax').title = $('winMax').ariaLabel = w.maximized ? 'Restore' : 'Maximize';
    };

    // Re-check busy tabs now and then: a tab stuck "loading" for 30 s stops looking busy.
    setInterval(() => {
      const now = Date.now();
      document.querySelectorAll('.tab.loading').forEach(el => {
        if (now - (+el.dataset.ls || now) > 30000) el.classList.remove('loading');
      });
      document.body.classList.toggle('loading', !!document.querySelector('.tab.active.loading'));
    }, 4000);
    $('lockIcon').innerHTML = ICONS.shoji;
    window.__syncFav(false);
    renderBar();
    $('btnPanel').hidden = prefs.sidebar === 'off';
    // Pose the little crane in the toast to match its message, now that the page has the kit.
    new ResizeObserver(reportAnchors).observe(document.querySelector('.nav'));
    post('ChromeReady');
    reportAnchors();
  </script>
</body>
</html>
