<!DOCTYPE html>
<html lang="en" data-accent="{{ACCENT}}" data-mode="{{MODE}}" data-fonts="{{FONTS}}" data-frost="{{FROST}}">
<head>
  <meta charset="UTF-8">
  <title>Shoji</title>
  <style>
{{THEME_CSS}}
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; font-size: 12.5px; user-select: none; background: var(--bg-sunk); }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus:not(:focus-visible) { outline: none; }

    /* Title bar: tabs share the top row with the window controls, like a shoji frame's top rail */
    .titlebar { position: relative; display: flex; align-items: flex-end; height: 38px; flex-shrink: 0; app-region: drag; }
    .tab, .new-tab, .caption button, .resize-top { app-region: no-drag; }
    .tab-strip { flex: 1; min-width: 0; display: flex; align-items: flex-end; height: 100%; padding-left: 8px; overflow: hidden; }
    #tabs { display: flex; align-items: flex-end; flex: 0 1 auto; min-width: 0; }
    .drag { flex: 1; min-width: 48px; height: 100%; }
    .caption { display: flex; flex-shrink: 0; height: 100%; align-self: flex-start; }
    .caption button { width: 46px; height: 100%; display: grid; place-items: center; color: var(--ink-2); font: 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; transition: background .1s, color .1s; }
    .caption button:hover { background: var(--hover); color: var(--ink); }
    .caption button:active { background: var(--press); }
    .caption #winClose:hover { background: #c42b1c; color: #fff; }
    .caption #winClose:active { background: #b02a1d; color: #fff; }
    body.inactive .tab-strip, body.inactive .caption { opacity: .55; }
    .resize-top { position: absolute; top: 0; left: 0; right: 138px; height: 4px; cursor: n-resize; z-index: 5; }
    body.maximized .resize-top { display: none; }
    .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; flex: 0 1 220px; min-width: 56px; padding: 0 8px 0 12px; border-radius: 7px 7px 0 0; color: var(--ink-2); cursor: default; transition: background .12s, color .12s; }
    .tab::after { content: ""; position: absolute; right: 0; top: 9px; bottom: 9px; width: 1px; background: var(--line); }
    .tab.active::after, .tab:has(+ .tab.active)::after, .tab:hover::after, .tab:has(+ .tab:hover)::after { opacity: 0; }
    .tab:hover:not(.active) { background: var(--hover); color: var(--ink); }
    .tab.active { background: var(--surface); color: var(--ink); }
    .tab.active::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--tone); }
    .tab * { pointer-events: none; }
    .tab .close { pointer-events: auto; }
    .tab.dragging { opacity: .45; }
    .tab.drop-left { box-shadow: inset 2px 0 0 var(--accent); }
    .tab.drop-right { box-shadow: inset -2px 0 0 var(--accent); }
    .favicon { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; object-fit: contain; }
    .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
    .close { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; color: var(--ink-3); opacity: 0; transition: opacity .12s, background .12s; }
    .tab:hover .close, .tab.active .close { opacity: 1; }
    .close:hover { background: var(--press); color: var(--ink); }
    .close svg.i { width: 12px; height: 12px; }
    .new-tab { display: grid; place-items: center; width: 28px; height: 28px; margin: 0 0 2px 4px; border-radius: 7px; color: var(--ink-2); flex-shrink: 0; }
    .new-tab:hover { background: var(--hover); color: var(--ink); }

    /* Navigation bar */
    .nav { display: flex; align-items: center; gap: 2px; height: 38px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .btn { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; color: var(--ink-2); flex-shrink: 0; transition: background .12s, color .12s; }
    .btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
    .btn:active:not(:disabled) { background: var(--press); }
    .btn:disabled { opacity: .35; cursor: default; }
    .omni { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; margin: 0 6px; }
    .lock { position: absolute; left: 4px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: var(--ink-3); z-index: 1; }
    .lock:hover { background: var(--hover); color: var(--ink); }
    .lock svg.i { width: 14px; height: 14px; }
    .lock.insecure { color: var(--warn); }
    #omnibox { width: 100%; height: 30px; padding: 0 64px 0 32px; border-radius: 8px; border: 1px solid transparent; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; outline: none; user-select: text; transition: border-color .15s, background .15s, box-shadow .15s; }
    #omnibox::placeholder { color: var(--ink-3); }
    #omnibox:hover { border-color: var(--line); }
    #omnibox:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint-soft); }
    .zoom { position: absolute; right: 5px; display: flex; align-items: center; height: 22px; border-radius: 11px; background: var(--hover); font-size: 11px; color: var(--ink-2); overflow: hidden; }
    .zoom[hidden] { display: none; }
    .zoom button { height: 100%; padding: 0 7px; font-variant-numeric: tabular-nums; }
    .zoom button:hover { background: var(--press); color: var(--ink); }
    .zoom .step { display: none; }
    .zoom.expanded .step { display: block; }
    .dl-ring { position: absolute; inset: 3px; width: 24px; height: 24px; transform: rotate(-90deg); pointer-events: none; }
    .dl-ring circle { fill: none; stroke-width: 2; }
    .dl-ring .track { stroke: var(--line); }
    .dl-ring .fill { stroke: var(--accent); stroke-dasharray: 69.1; stroke-dashoffset: 69.1; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
    #btnDark.on { color: var(--accent); }
    #btnNotes.open { background: var(--tint); color: var(--ink); }
    .dl-count { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; font-size: 9px; font-weight: 700; line-height: 14px; background: var(--tone); color: var(--on-tone); }

    /* Third row: find and permission trays */
    .tray { display: none; align-items: center; gap: 8px; height: 38px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .tray.open { display: flex; }
    #findBar { justify-content: flex-end; }
    #findInput { width: 240px; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; outline: none; user-select: text; }
    #findInput:focus { border-color: var(--accent); }
    #findCount { min-width: 48px; text-align: center; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    #permissionBar { justify-content: space-between; }
    .perm-msg { display: flex; align-items: center; gap: 10px; color: var(--ink); }
    .perm-msg svg.i { color: var(--accent); }
    .pill { height: 26px; padding: 0 14px; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .pill.primary { background: var(--tone); color: var(--on-tone); }
    .pill.primary:hover { filter: brightness(.96); }
    .pill.quiet { background: var(--surface-2); }
    .pill.quiet:hover { background: var(--press); }

    /* Tab groups: a coloured label ahead of the first tab, and a coloured line under each tab */
    .group-chip { align-self: center; flex: 0 0 auto; display: block; line-height: 22px; max-width: 120px; height: 22px; margin: 0 2px 0 6px; padding: 0 9px; border-radius: 11px; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #26231f; background: var(--g, var(--tone)); app-region: no-drag; cursor: default; }
    .tab[data-group]::before { content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 3px; border-radius: 2px 2px 0 0; background: var(--g); }
    .tab.active[data-group]::before { top: auto; left: 6px; right: 6px; height: 3px; background: var(--g); }
    .tab.split-pane { box-shadow: inset 0 -2px 0 var(--accent); }
    .tab.split-pane .title::before { content: "\25EB  "; color: var(--accent); }

    /* Favourite / reader / picture-in-picture buttons */
    #btnFav.on { color: var(--accent); }
    #btnReader.on { background: var(--tint); color: var(--ink); }
    #btnPip[hidden], #btnReader[hidden] { display: none; }

    /* Byobu shield: outline when idle, filled chip with a count while it is blocking */
    #btnShield { position: relative; }
    #btnShield[hidden] { display: none; }
    #btnShield[data-state="off"], #btnShield[data-state="paused"] { color: var(--ink-3); }
    #btnShield .slash { display: none; }
    #btnShield[data-state="off"] .slash, #btnShield[data-state="paused"] .slash { display: inline; }
    #btnShield[data-state="off"] .check, #btnShield[data-state="paused"] .check { display: none; }
    #btnShield.busy { background: var(--tint); color: var(--ink); }
    #btnShield .count { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--ink); color: var(--surface); font-size: 9.5px; font-weight: 600; line-height: 14px; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
    #btnShield .count[hidden] { display: none; }

    /* Page-tinted toolbar: a soft wash of the site's own colour over the toolbar rows */
    html[data-tint] .nav, html[data-tint] .tray { background: color-mix(in srgb, var(--page-tint) 16%, var(--surface)); }
    html[data-tint] body { background: color-mix(in srgb, var(--page-tint) 22%, var(--bg-sunk)); }
    html[data-tint] .tab.active { background: color-mix(in srgb, var(--page-tint) 16%, var(--surface)); }
    .nav, .tray, body, .tab.active { transition: background-color .25s; }

    /* Windows 11 frosted toolbar: the window's Mica backdrop shows through */
    html[data-frost="1"], html[data-frost="1"] body { background: transparent; }
    html[data-frost="1"] .nav, html[data-frost="1"] .tray { background: color-mix(in srgb, var(--surface) 60%, transparent); border-bottom-color: transparent; }
    html[data-frost="1"] .tab.active { background: color-mix(in srgb, var(--surface) 75%, transparent); }
    html[data-frost="1"] #omnibox { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="resize-top" onmousedown="if (event.button === 0) post('StartWindowResize')"></div>
    <div class="tab-strip" id="tabStrip">
      <div id="tabs" role="tablist" aria-label="Tabs"></div>
      <button class="new-tab" onclick="post('CreateTab', { url: null })" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="drag" id="dragArea"></div>
    </div>
    <div class="caption">
      <button id="winMin" onclick="post('MinimizeWindow')" title="Minimize" aria-label="Minimize">&#xE921;</button>
      <button id="winMax" onclick="post('ToggleMaximize')" title="Maximize" aria-label="Maximize">&#xE922;</button>
      <button id="winClose" onclick="post('CloseWindow')" title="Close" aria-label="Close">&#xE8BB;</button>
    </div>
  </div>

  <div class="nav" role="toolbar" aria-label="Navigation">
    <button class="btn" id="btnBack" onclick="post('GoBack')" disabled title="Back (Alt+Left)" aria-label="Back">
      <svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </button>
    <button class="btn" id="btnForward" onclick="post('GoForward')" disabled title="Forward (Alt+Right)" aria-label="Forward">
      <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <button class="btn" id="btnReload" onclick="post('Reload')" title="Reload (Ctrl+R)" aria-label="Reload">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>

    <div class="omni">
      <button class="lock" id="btnLock" onclick="post('ToggleSecurityPanel')" title="Site information" aria-label="Site information">
        <svg class="i" viewBox="0 0 24 24" id="lockIcon"></svg>
      </button>
      <input id="omnibox" type="text" spellcheck="false" autocomplete="off" aria-label="Address and search"
             placeholder="Search {{SEARCH_ENGINE_NAME}} or enter an address" onkeydown="omniKey(event)"
             oninput="omniInput()" onfocus="omniFocus()" onblur="omniBlur()">
      <div class="zoom" id="zoom" hidden onmouseenter="this.classList.add('expanded')" onmouseleave="this.classList.remove('expanded')">
        <button class="step" onclick="post('ZoomOut')" title="Zoom out (Ctrl+-)">−</button>
        <button onclick="post('ZoomReset')" id="zoomReset" title="Reset zoom (Ctrl+0)">100%</button>
        <button class="step" onclick="post('ZoomIn')" title="Zoom in (Ctrl++)">+</button>
      </div>
    </div>

    <button class="btn" id="btnFav" onclick="post('ToggleFavourite')" title="Add to favourites (Ctrl+D)" aria-label="Favourite">
      <svg class="i" viewBox="0 0 24 24" id="favIcon"></svg>
    </button>
    <button class="btn" id="btnReader" onclick="post('ToggleReader')" title="Reader view (F9)" aria-label="Reader view">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>
    </button>
    <button class="btn" id="btnPip" onclick="post('TogglePictureInPicture')" title="Picture in picture" aria-label="Picture in picture" hidden>
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="btnShield" onclick="post('ToggleShieldPanel')" title="Byōbu shield" aria-label="Byōbu shield" hidden>
      <svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.3-3 7.7-7 9.5-4-1.8-7-5.2-7-9.5V6z"/><path class="check" d="M9 12l2 2 4-4"/><path class="slash" d="M5 4l14 16"/></svg>
      <span class="count" id="shieldCount" hidden>0</span>
    </button>
    <button class="btn" id="btnDark" onclick="post('ToggleDarkWebsites')" oncontextmenu="event.preventDefault(); toggleDarkSite()" aria-label="Dark websites">
      <svg class="i" viewBox="0 0 24 24" id="darkIcon"></svg>
    </button>
    <button class="btn" id="btnNotes" onclick="post('ToggleNotes')" title="Quick note" aria-label="Quick note">
      <svg class="i" viewBox="0 0 24 24"><path d="M7 3.5h8.5L19 7v13.5H7z"/><path d="M15.5 3.5V7H19M10 11h6M10 14.5h6M10 18h3.5"/><path d="M4.5 6v15"/></svg>
    </button>
    <button class="btn" id="btnDownloads" onclick="post('ToggleDownloadsSidebar')" title="Downloads (Ctrl+J)" aria-label="Downloads">
      <svg class="i" viewBox="0 0 24 24" id="dlIdle"><path d="M4 13.5l2.2-7.1A2 2 0 0 1 8.1 5h7.8a2 2 0 0 1 1.9 1.4l2.2 7.1V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></svg>
      <svg class="i" viewBox="0 0 24 24" id="dlActive" style="display:none"><path d="M12 6.5v9M8.5 12l3.5 3.5 3.5-3.5"/></svg>
      <svg class="dl-ring" id="dlRing" viewBox="0 0 26 26" style="display:none"><circle class="track" cx="13" cy="13" r="11"/><circle class="fill" id="dlRingFill" cx="13" cy="13" r="11"/></svg>
      <span class="dl-count" id="dlCount" hidden>0</span>
    </button>
    <button class="btn" id="btnMenu" onclick="post('ToggleMenuPanel')" title="Menu" aria-label="Menu">
      <svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    </button>
  </div>

  <div class="tray" id="findBar">
    <input id="findInput" type="text" spellcheck="false" placeholder="Find in page" oninput="find(true)" onkeydown="findKey(event)">
    <span id="findCount">0/0</span>
    <button class="btn" onclick="find(false)" title="Previous (Shift+Enter)" aria-label="Previous match"><svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="btn" onclick="find(true)" title="Next (Enter)" aria-label="Next match"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="btn" onclick="closeFind()" title="Close (Esc)" aria-label="Close find"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div class="tray" id="permissionBar">
    <div class="perm-msg">
      <svg class="i" viewBox="0 0 24 24" id="permIcon"></svg>
      <span id="permMsg"></span>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="pill quiet" onclick="resolvePermission(false)">Block</button>
      <button class="pill primary" onclick="resolvePermission(true)">Allow</button>
    </div>
  </div>

  <script>
    const ICONS = {
      lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
      open: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
      shoji: '<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M12 4v16M4 12h16"/>',
      camera: '<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/>',
      mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
      location: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
      bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
    };
    const SHOJI_FAVICON = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#8f897e" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M12 4v16M4 12h16"/></svg>');
    const INTERNAL_TITLES = { 'shoji://newtab': 'New tab', 'shoji://settings': 'Settings', 'shoji://welcome': 'Welcome', 'about:blank': 'New tab' };

    let prefs = {{PREFS_JSON}};
    let activeTabId = null;
    let drag = null;

    function post(action, payload = null) {
      if (window.ipc) window.ipc.postMessage(JSON.stringify({ action, payload }));
    }
    const $ = id => document.getElementById(id);
    const isInternal = url => url.startsWith('shoji://') || url === 'about:blank';

    const ACCENTS = {{ACCENTS_JSON}};
    const toneOf = id => (ACCENTS.find(a => a.id === id) || ACCENTS[0]).tone;
    const hostOf = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };
    let state = { tabs: [], groups: [], split: null };
    let data = { favs: [], recent: [] };
    let suggestions = [], sel = -1, suggestTimer = 0, suggestSeq = 0;

    /* Address bar: compact (domain only) until clicked, with suggestions while typing */
    function shownUrl(full, focused) {
      if (!full) return '';
      if (focused || !prefs.compactAddress) return full;
      return hostOf(full) || full;
    }
    function omniFocus() {
      const o = $('omnibox');
      if (o.dataset.url) o.value = o.dataset.url;
      o.select();
    }
    function omniBlur() {
      const o = $('omnibox');
      closeSuggest();
      o.value = shownUrl(o.dataset.url || '', false);
    }
    function closeSuggest() {
      clearTimeout(suggestTimer);
      suggestSeq++;
      if (suggestions.length || sel !== -1) post('SuggestClose');
      suggestions = []; sel = -1;
    }
    function localSuggestions(q) {
      const words = q.toLowerCase().split(/\s+/).filter(Boolean);
      const match = (t, u) => { const h = (t + ' ' + u).toLowerCase(); return words.every(w => h.includes(w)); };
      const out = [], seen = new Set();
      const add = it => { if (!seen.has(it.value) && out.length < 8) { seen.add(it.value); out.push(it); } };
      state.tabs.forEach(t => {
        if (!isInternal(t.url) && match(t.title || '', t.url)) add({ kind: 'tab', value: String(t.id), label: t.title || t.url, sub: 'Switch to tab \u00b7 ' + hostOf(t.url) });
      });
      data.favs.forEach(f => { if (match(f.title, f.url)) add({ kind: 'url', value: f.url, label: f.title, sub: f.url, color: 'var(--accent)' }); });
      data.recent.forEach(r => { if (match(r.title || '', r.url)) add({ kind: 'url', value: r.url, label: r.title || r.url, sub: 'Recently closed \u00b7 ' + hostOf(r.url) }); });
      return out;
    }
    function showSuggest(items) {
      suggestions = items; sel = -1;
      if (!items.length) { post('SuggestClose'); return; }
      const r = $('omnibox').getBoundingClientRect();
      post('SuggestShow', { items, x: r.left, width: r.width });
    }
    let histItems = [];
    // History matches arrive from the host a moment after the local ones.
    window.__historyResults = (seq, items) => {
      if (seq !== suggestSeq || !items.length) return;
      const seen = new Set(suggestions.map(s => s.value));
      histItems = items.filter(h => !seen.has(h.url)).map(h => ({ kind: 'url', value: h.url, label: h.title || h.url, sub: 'History \u00b7 ' + hostOf(h.url) }));
      if (histItems.length) showSuggest(suggestions.concat(histItems).slice(0, 8));
    };
    function omniInput() {
      const q = $('omnibox').value.trim();
      clearTimeout(suggestTimer);
      if (!q) { closeSuggest(); return; }
      const seq = ++suggestSeq;
      const local = localSuggestions(q);
      histItems = [];
      showSuggest(local);
      if (!/^[a-z]+:\/\//i.test(q)) post('SearchHistory', { query: q, seq });
      // Optional: ask the search engine too (off unless enabled in Settings).
      if (prefs.searchSuggestions && prefs.suggestUrl && q.length > 1 && !/^[a-z]+:\/\//i.test(q)) {
        suggestTimer = setTimeout(async () => {
          try {
            const res = await fetch(prefs.suggestUrl.replace('%s', encodeURIComponent(q)));
            const json = await res.json();
            if (seq !== suggestSeq) return;
            const words = (Array.isArray(json) ? json[1] : []).filter(w => typeof w === 'string').slice(0, 5);
            const merged = local.slice(0, 4).concat(histItems.slice(0, 2)).concat(words.map(w => ({ kind: 'search', value: w, label: w, sub: 'Search' })));
            showSuggest(merged);
          } catch { /* offline or blocked: local suggestions stay */ }
        }, 120);
      }
    }
    function omniKey(e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!suggestions.length) return;
        e.preventDefault();
        const n = suggestions.length;
        sel = e.key === 'ArrowDown' ? (sel + 1 >= n ? -1 : sel + 1) : (sel - 1 < -1 ? n - 1 : sel - 1);
        post('SuggestHighlight', { index: sel });
      } else if (e.key === 'Enter') {
        const picked = suggestions[sel];
        const val = e.target.value.trim();
        closeSuggest();
        if (picked) post('OverlayChoose', { kind: picked.kind, value: picked.value });
        else if (val) post('Navigate', { url: val });
        e.target.blur();
      } else if (e.key === 'Escape') {
        closeSuggest();
        e.target.value = e.target.dataset.url || '';
        e.target.blur();
      }
    }
    window.__setData = d => { data = d; };
    window.__syncFav = on => {
      $('btnFav').classList.toggle('on', on);
      $('favIcon').innerHTML = STAR + (on ? '' : '');
      $('favIcon').querySelector('path').setAttribute('fill', on ? 'currentColor' : 'none');
      $('btnFav').title = on ? 'Remove from favourites (Ctrl+D)' : 'Add to favourites (Ctrl+D)';
    };
    const STAR = '<path d="M12 3.8l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17.1l-5.2 2.8 1-5.8L3.5 10l5.9-.9z"/>';
    window.__tint = c => {
      const r = document.documentElement;
      if (c && prefs.tintToolbar) { r.style.setProperty('--page-tint', c); r.dataset.tint = '1'; }
      else { r.removeAttribute('data-tint'); }
    };
    window.__shieldSync = d => {
      const b = $('btnShield');
      b.hidden = d.state === 'none';
      b.dataset.state = d.state;
      const n = d.blocked + d.replaced;
      const shown = d.state === 'on' && n > 0;
      $('shieldCount').hidden = !shown;
      $('shieldCount').textContent = n > 999 ? '999+' : String(n);
      b.classList.toggle('busy', shown);
      b.title = d.state === 'paused' ? 'Byōbu is paused on this site'
        : d.state === 'off' ? 'Byōbu is off'
        : n > 0 ? `Byōbu blocked ${n} on this page` : 'Byōbu shield';
    };
    window.__syncPage = d => {
      $('btnPip').hidden = !d.hasVideo;
      $('btnReader').classList.toggle('on', !!d.reader);
      $('btnReader').title = d.reader ? 'Exit reader view (F9)' : 'Reader view (F9)';
    };

    /* Tabs: create each element once, then patch only what changed */
    function buildTab(id) {
      const el = document.createElement('div');
      el.className = 'tab';
      el.id = 'tab-' + id;
      el.setAttribute('role', 'tab');
      el.innerHTML = '<img class="favicon" alt=""><span class="title"></span>' +
        '<button class="close" tabindex="-1" aria-label="Close tab"><svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>';
      el.querySelector('.favicon').onerror = function () { this.src = SHOJI_FAVICON; };
      el.onmousedown = e => { if (e.button === 1) { e.preventDefault(); post('CloseTab', { id }); } };
      el.onclick = () => post('SwitchTab', { id });
      el.oncontextmenu = e => { e.preventDefault(); post('TabMenu', { tab_id: id, x: e.clientX, y: 36 }); };
      el.querySelector('.close').onclick = e => { e.stopPropagation(); post('CloseTab', { id }); };
      el.draggable = true;
      el.ondragstart = e => { drag = { id, index: +el.dataset.index, dropped: false }; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
      el.ondragend = e => {
        el.classList.remove('dragging');
        clearDropMarks();
        const outside = e.clientY > 76 || e.clientY < -40 || e.clientX < -40 || e.clientX > innerWidth + 40;
        if (drag && !drag.dropped && outside && prefs.tearoff) {
          post('DetachTabToNewWindow', { tab_id: drag.id, screen_x: e.screenX, screen_y: e.screenY });
        }
        drag = null;
      };
      el.ondragover = e => {
        if (!drag || !prefs.reorder) return;
        e.preventDefault();
        const r = el.getBoundingClientRect();
        const left = e.clientX < r.left + r.width / 2;
        el.classList.toggle('drop-left', left);
        el.classList.toggle('drop-right', !left);
      };
      el.ondragleave = () => el.classList.remove('drop-left', 'drop-right');
      el.ondrop = e => {
        e.preventDefault();
        if (!drag || !prefs.reorder) return;
        drag.dropped = true;
        const r = el.getBoundingClientRect();
        let to = +el.dataset.index + (e.clientX < r.left + r.width / 2 ? 0 : 1);
        if (drag.index < to) to--;
        clearDropMarks();
        if (to !== drag.index) post('ReorderTab', { from_index: drag.index, to_index: to });
      };
      return el;
    }
    function clearDropMarks() {
      document.querySelectorAll('.drop-left, .drop-right').forEach(t => t.classList.remove('drop-left', 'drop-right'));
    }
    function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
    function setAttr(el, name, value) { if (el.getAttribute(name) !== value) el.setAttribute(name, value); }

    window.__shellUpdate = function (msg) {
      const incoming = msg && (msg.data || msg);
      if (!incoming || !incoming.tabs) return;
      state = { tabs: incoming.tabs, groups: incoming.groups || [], split: incoming.split || null };
      const state_ = incoming;
      const container = $('tabs');
      const switched = activeTabId !== state_.active_tab_id;
      activeTabId = state_.active_tab_id;
      const groupById = new Map(state.groups.map(g => [g.id, g]));
      // Rebuild the strip order: group chip (once per group), then its tabs.
      const order = [];
      const chipped = new Set();
      state.tabs.forEach(tab => {
        if (tab.group != null && groupById.has(tab.group) && !chipped.has(tab.group)) {
          chipped.add(tab.group);
          order.push({ chip: groupById.get(tab.group), first: tab.id });
        }
        order.push({ tab });
      });
      const keep = new Set(order.map(o => o.chip ? 'grp-' + o.chip.id : 'tab-' + o.tab.id));
      for (const child of [...container.children]) if (!keep.has(child.id)) child.remove();

      order.forEach((o, position) => {
        let el;
        if (o.chip) {
          el = $('grp-' + o.chip.id) || (() => {
            const c = document.createElement('div');
            c.className = 'group-chip'; c.id = 'grp-' + o.chip.id;
            c.onclick = () => post('TabMenu', { tab_id: +c.dataset.first, x: c.getBoundingClientRect().left, y: 36 });
            return c;
          })();
          el.dataset.first = o.first;
          setText(el, o.chip.name);
          el.style.setProperty('--g', toneOf(o.chip.color));
          if (container.children[position] !== el) container.insertBefore(el, container.children[position] || null);
          return;
        }
        const tab = o.tab;
        const index = state.tabs.indexOf(tab);
        el = $('tab-' + tab.id) || buildTab(tab.id);
        if (container.children[position] !== el) container.insertBefore(el, container.children[position] || null);
        el.dataset.index = index;
        const g = tab.group != null ? groupById.get(tab.group) : null;
        if (g) { el.dataset.group = g.id; el.style.setProperty('--g', toneOf(g.color)); }
        else { delete el.dataset.group; el.style.removeProperty('--g'); }
        el.classList.toggle('split-pane', !!state.split && state.split.includes(tab.id));
        const active = tab.id === state_.active_tab_id;
        el.classList.toggle('active', active);
        setAttr(el, 'aria-selected', String(active));
        setAttr(el, 'tabindex', active ? '0' : '-1');
        const internal = isInternal(tab.url);
        const title = (internal && INTERNAL_TITLES[tab.url]) || tab.title || tab.url;
        setText(el.querySelector('.title'), title);
        const shortcut = index < 8 ? index + 1 : (index === state.tabs.length - 1 ? 9 : 0);
        setAttr(el, 'title', shortcut ? `${title}  (Ctrl+${shortcut})` : title);
        const icon = (!internal && tab.favicon_uri) || SHOJI_FAVICON;
        const img = el.querySelector('.favicon');
        if (img.dataset.src !== icon) { img.dataset.src = icon; img.src = icon; }

        if (active) syncActive(tab, internal, switched);
      });
    };

    function syncActive(tab, internal, switched) {
      const omni = $('omnibox');
      const shown = internal ? '' : tab.url;
      const focused = document.activeElement === omni;
      if (omni.dataset.url !== shown) {
        omni.dataset.url = shown;
        if (switched || !focused) omni.value = shownUrl(shown, focused);
      } else if (switched) {
        omni.value = shownUrl(shown, focused);
      }
      try { activeHost = internal ? '' : new URL(tab.url).hostname.replace(/^www\./, ''); } catch { activeHost = ''; }
      syncDark();
      $('btnBack').disabled = !tab.can_go_back;
      $('btnForward').disabled = !tab.can_go_forward;
      const kind = internal ? 'shoji' : (tab.url.startsWith('https://') ? 'lock' : 'open');
      const lock = $('btnLock');
      if (lock.dataset.kind !== kind) {
        lock.dataset.kind = kind;
        lock.className = 'lock' + (kind === 'open' ? ' insecure' : '');
        $('lockIcon').innerHTML = ICONS[kind];
        lock.title = kind === 'shoji' ? 'Shoji page' : (kind === 'lock' ? 'Connection is secure' : 'Connection is not secure');
      }
    }

    window.__focusOmnibox = () => { const o = $('omnibox'); o.focus(); o.select(); };
    window.__syncSearchEngine = name => { $('omnibox').placeholder = `Search ${name} or enter an address`; };
    window.__applyTheme = t => { const r = document.documentElement; r.dataset.accent = t.accent; if (t.mode) r.dataset.mode = t.mode; if (t.fonts) r.dataset.fonts = t.fonts; };
    window.__applyPrefs = p => {
      prefs = p;
      if (!prefs.zoomBadge) $('zoom').hidden = true;
      renderDownloads(); syncDark();
      const o = $('omnibox');
      if (document.activeElement !== o) o.value = shownUrl(o.dataset.url || '', false);
      if (!prefs.tintToolbar) window.__tint(null);
    };

    /* Dark websites: filled moon = on here, outline = off, outline with a stroke = skipped site */
    const MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
    let activeHost = '';
    const siteExcluded = host => prefs.darkExclude.some(p => {
      p = p.replace(/^\*\./, '');
      return host === p || host.endsWith('.' + p);
    });
    function syncDark() {
      const btn = $('btnDark');
      const excluded = !!activeHost && siteExcluded(activeHost);
      const on = prefs.darkWebsites && !excluded;
      btn.classList.toggle('on', on);
      $('darkIcon').innerHTML = on ? MOON.replace('<path', '<path fill="currentColor"')
        : MOON + (excluded && prefs.darkWebsites ? '<path d="M4 4l16 16"/>' : '');
      btn.title = !prefs.darkWebsites ? 'Dark websites: off. Click to turn on'
        : excluded ? 'Dark websites: skipped on ' + activeHost + '. Right-click to include it'
        : 'Dark websites: on. Click to turn off, right-click to skip this site';
    }
    function toggleDarkSite() { if (activeHost) post('ToggleDarkSite', { host: activeHost }); }
    window.__syncNotes = open => $('btnNotes').classList.toggle('open', open);

    /* Zoom: a quiet pill in the address bar while not at 100%; hover for − / + */
    window.__syncZoom = function (factor) {
      const pct = Math.round(factor * 100);
      setText($('zoomReset'), pct + '%');
      $('zoom').hidden = pct === 100 || !prefs.zoomBadge;
    };

    /* Downloads */
    const downloads = new Map();
    window.__downloadProgress = function (d) {
      downloads.set(d.download_id, d);
      renderDownloads();
    };
    function renderDownloads() {
      let received = 0, total = 0, active = 0;
      for (const d of downloads.values()) {
        if (d.state === 'InProgress') { active++; received += d.received_bytes; total += Math.max(d.total_bytes, 0); }
      }
      const show = active > 0 && prefs.downloadsRing;
      // SVG elements have no .hidden property; toggle display instead.
      const vis = (id, on) => { $(id).style.display = on ? '' : 'none'; };
      vis('dlRing', show);
      vis('dlIdle', active === 0);
      vis('dlActive', active > 0);
      $('dlCount').hidden = !show || active < 2;
      setText($('dlCount'), String(active));
      $('dlRingFill').style.strokeDashoffset = 69.1 * (1 - (total > 0 ? Math.min(1, received / total) : 0));
    }

    /* Find in page */
    function toggleFindBar() {
      const bar = $('findBar');
      if (bar.classList.contains('open')) return closeFind();
      bar.classList.add('open');
      post('OpenFindInPage');
      const input = $('findInput');
      input.focus();
      input.select();
      if (input.value) find(true);
    }
    function closeFind() {
      if (!$('findBar').classList.contains('open')) return;
      $('findBar').classList.remove('open');
      post('CloseFindInPage');
    }
    function find(forward) {
      const query = $('findInput').value;
      if (!query) { setText($('findCount'), '0/0'); return; }
      post('FindInPage', { query, forward });
    }
    function findKey(e) {
      if (e.key === 'Enter') find(!e.shiftKey);
      else if (e.key === 'Escape') closeFind();
    }
    window.__toggleFindBar = toggleFindBar;
    window.__syncFindResult = d => setText($('findCount'), d.total > 0 ? `${d.current} of ${d.total}` : '0/0');

    /* Permission tray */
    let pendingPermission = null;
    window.__permissionPrompt = function (d) {
      pendingPermission = d.permission_id;
      const k = (d.permission_kind || '').toLowerCase();
      $('permIcon').innerHTML = k.includes('camera') ? ICONS.camera : k.includes('micro') ? ICONS.mic
        : k.includes('geo') ? ICONS.location : k.includes('notif') ? ICONS.bell : ICONS.info;
      $('permMsg').textContent = `${d.origin} wants to use your ${d.permission_kind.toLowerCase()}`;
      $('permissionBar').classList.add('open');
      post('OpenPermissionPrompt');
    };
    function resolvePermission(allow) {
      if (pendingPermission !== null) post('PermissionResponse', { permission_id: pendingPermission, allow });
      pendingPermission = null;
      $('permissionBar').classList.remove('open');
      post('ClosePermissionPrompt');
    }

    /* Keyboard navigation within the tab list */
    $('tabs').addEventListener('keydown', e => {
      const tabs = [...$('tabs').children];
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      const to = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      tabs[to].focus();
      post('SwitchTab', { id: +tabs[to].id.slice(4) });
    });

    /* Window frame: empty title-bar space is an app-region drag area, handled natively by
       WebView2 + Windows (drag, double-click to maximize, right-click for the system menu). */
    window.__syncWindow = w => {
      document.body.classList.toggle('maximized', w.maximized);
      document.body.classList.toggle('inactive', !w.focused);
      $('winMax').innerHTML = w.maximized ? '&#xE923;' : '&#xE922;';
      $('winMax').title = $('winMax').ariaLabel = w.maximized ? 'Restore' : 'Maximize';
    };

    $('lockIcon').innerHTML = ICONS.shoji;
    window.__syncFav(false);
    post('ChromeReady');
  </script>
</body>
</html>
