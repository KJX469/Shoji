[package]
name = "shoji-setup"
version = "0.2.0"
edition = "2021"
authors = ["Shoji Contributors"]
description = "Fast, non-elevated installer and uninstaller for Shoji"
license = "MIT"

[dependencies]
shoji-core = { path = "../core" }
shoji-brand = { path = "../brand" }
winit = "0.30"
wry = "0.57"
serde_json = "1.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[build-dependencies]
winres = "0.1"
shoji-brand = { path = "../brand" }
