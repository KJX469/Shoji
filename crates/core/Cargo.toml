[package]
name = "shoji-core"
version = "0.1.2"
edition = "2021"
authors = ["Shoji Contributors"]
description = "Engine-agnostic state, settings and IPC protocol for Shoji"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ring = "0.17"
shoji-brand = { path = "../brand" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
]
