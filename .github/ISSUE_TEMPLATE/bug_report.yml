name: Bug report
description: Something doesn't work in an official release
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and how to reproduce it
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shoji and Windows version
      placeholder: Shoji 0.1.5, Windows 11 24H2
    validations:
      required: true
