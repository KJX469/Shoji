# Builds the extension store's catalog from the Chrome Web Store's category listings and adds it
# to the Byobu data release, weekly.
name: extension-catalog

on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - scripts/extension-catalog.mjs
      - .github/workflows/extension-catalog.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          mkdir out
          node scripts/extension-catalog.mjs out/extension-catalog.json
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-catalog
          path: out/

  # Runs no catalog code; only this job can write to the repository.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-catalog
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload byobu-data out/extension-catalog.json --clobber
