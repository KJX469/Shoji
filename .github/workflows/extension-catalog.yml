name: extension-catalog
on:
  push:
    branches: [claude/store-probe]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          mkdir out
          time node scripts/extension-catalog.mjs out/extension-catalog.json 2>&1 | tail -40
          ls -l out
          node -e "const l=require('./out/extension-catalog.json');const c={};l.forEach(e=>c[e.cat]=(c[e.cat]||0)+1);console.log(l.length,JSON.stringify(c));console.log(l.slice(0,5).map(e=>e.name+' '+e.users).join(' | '));console.log('no icon',l.filter(e=>!e.icon).length,'no text',l.filter(e=>!e.text).length)"
