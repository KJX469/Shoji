name: extension-catalog
on:
  push:
    branches: [claude/store-probe]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - shell: node {0}
        run: |
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36';
          const idx = await (await fetch('https://chromewebstore.google.com/sitemap', { headers: { 'user-agent': UA } })).text();
          const shards = [...idx.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
          console.log('shards', shards.length, shards[shards.length - 1]);
          let total = 0, ext = 0, bytes = 0; const sample = [];
          for (const u of shards.slice(0, 3)) {
            const t0 = Date.now();
            const x = await (await fetch(u.replace(/&amp;/g, '&'), { headers: { 'user-agent': UA } })).text();
            const locs = [...x.matchAll(/<loc>https:\/\/chromewebstore\.google\.com\/detail\/([^<\/]*)\/([a-p]{32})<\/loc>/g)];
            total += locs.length; bytes += x.length;
            console.log(u, x.length, 'bytes', locs.length, 'detail urls', Date.now() - t0, 'ms');
            for (let i = 0; i < locs.length; i += Math.floor(locs.length / 4)) sample.push(decodeURIComponent(locs[i][1]) + ' ' + locs[i][2]);
          }
          console.log(total, 'urls in 3 shards;', sample.join(' | '));
