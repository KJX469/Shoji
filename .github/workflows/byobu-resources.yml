# Builds the signed Byobu data release from the upstream commits pinned in byobu-pins.json:
# uBlock Origin's scriptlets (GPL-3.0), Brave's resources and Consent-O-Matic's rules (MIT).
name: byobu-resources

on:
  push:
    branches: [main]
    paths:
      - .github/byobu-pins.json
      - .github/workflows/byobu-resources.yml
      - scripts/byobu-assemble.mjs
  workflow_dispatch:

permissions: {}

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Assemble from the pinned commits
        run: |
          mkdir out
          node scripts/byobu-assemble.mjs out/ubo-resources.json "$RUNNER_TEMP/ubo" "$(jq -r .ublock .github/byobu-pins.json)"
          curl -fsSL -o out/brave-resources.json \
            "https://raw.githubusercontent.com/brave/adblock-resources/$(jq -r .brave .github/byobu-pins.json)/dist/resources.json"
          # Consent-O-Matic keeps one file per consent platform; Shoji reads them as one.
          com="$RUNNER_TEMP/consent"
          git init -q "$com"
          git -C "$com" fetch -q --depth 1 https://github.com/cavi-au/Consent-O-Matic.git "$(jq -r .consentomatic .github/byobu-pins.json)"
          git -C "$com" checkout -q FETCH_HEAD
          jq -cs 'map(del(."$schema")) | add' "$com"/rules/*.json > out/consent-rules.json
      - name: Sanity check
        run: |
          # uBlock ships ~200 resources, Brave's own bundle ~20.
          for check in ubo-resources:100 brave-resources:5; do
            f=out/${check%%:*}.json
            jq -e --argjson min "${check##*:}" 'type == "array" and length >= $min' "$f" >/dev/null
            echo "$f: $(jq length "$f") resources"
          done
          # ~200 consent platforms, each with detectors and steps.
          jq -e 'type == "object" and length >= 100 and all(.[]; (.detectors | type) == "array" and (.methods | type) == "array")' \
            out/consent-rules.json >/dev/null
          echo "out/consent-rules.json: $(jq length out/consent-rules.json) consent platforms"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byobu-data
          path: out/

  # Runs no upstream code; only this job can write to the repository.
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: byobu-data
          path: out
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view byobu-data >/dev/null 2>&1 || gh release create byobu-data \
            --title "Byobu data" --prerelease \
            --notes "uBlock Origin scriptlets and redirect resources (https://github.com/gorhill/uBlock, GPL-3.0), Brave's resources (https://github.com/brave/adblock-resources, MPL-2.0) and Consent-O-Matic's cookie-notice rules (https://github.com/cavi-au/Consent-O-Matic, MIT). Downloaded by Shoji at runtime; not part of the MIT browser binary."
          gh release upload byobu-data out/* --clobber
