# Builds the installer when a version tag is pushed (git tag v0.1.0 && git push --tags)
# and attaches it, with a checksum, to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ShojiSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ShojiSetup.exe" | Set-Content -Encoding ascii dist/ShojiSetup.exe.sha256
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $notes = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' |
            Where-Object { $_.StartsWith("[$v]") } | Select-Object -First 1
          if (-not $notes) { $notes = "Release $v" }
          ($notes -replace '(?s)^[^\n]*\n', '').Trim() | Set-Content -Encoding utf8 notes.md
          gh release create "${{ github.ref_name }}" dist/ShojiSetup.exe dist/ShojiSetup.exe.sha256 `
            --title "Shoji ${{ github.ref_name }}" --notes-file notes.md
