[workspace]
members = [
    "crates/brand",
    "crates/core",
    "crates/byobu",
    "crates/app",
    "crates/installer",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Lean dev and test builds keep target/ small: no debug info (no .pdb files) and no incremental cache.
[profile.dev]
debug = false
incremental = false

# Byōbu compiles hundreds of thousands of rules; unoptimised, that takes minutes in test builds.
[profile.dev.package.adblock]
opt-level = 3
