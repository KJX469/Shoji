<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-label="Minimal origami crane logo for Shoji in gold">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE074"/>
      <stop offset="1" stop-color="#F8B42C"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DB8016"/>
      <stop offset="1" stop-color="#A65A0C"/>
    </linearGradient>
  </defs>

  <!-- Rear wing / tail -->
  <path d="M282 547 515 653 517 827Z" fill="url(#paper)"/>
  <!-- Large, upright folded wing -->
  <path d="M529 334 731 660 529 869Z" fill="url(#paper)"/>
  <!-- The contrasting reverse side of the paper -->
  <path d="M529 869 731 660 791 767Z" fill="url(#coral)"/>
  <!-- Neck and head: an unbroken folded-paper silhouette -->
  <path d="M731 660 860 540Q865 535 870 540L962 599 862 586 873 547 865 543 790 766Z" fill="url(#paper)"/>
</svg>
